<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>R.U.D.I. — Screens</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ---------------------------------------------------------------
       Gleiches Design-System wie control.html (Zinc-Dunkelpalette,
       JetBrains Mono/Inter, HUD-Eckenklammern, Dot-Grid-Hintergrund,
       Live-Dot) -- betrifft NUR diese Hülle/Steuerleiste. Die
       eingebetteten Original-Seiten (per iframe) bleiben unangetastet,
       damit das physische E-Ink-Display unverändert bleibt.
    --------------------------------------------------------------- */
    :root {
      --bg: #000000;
      --panel: #0a0a0b;
      --line: #27272a;      /* zinc-800 */
      --line-soft: #18181b; /* zinc-900 */
      --ink: #ffffff;
      --ink-dim: #d4d4d8;   /* zinc-300 */
      --ink-body: #a1a1aa;  /* zinc-400 */
      --ink-label: #71717a; /* zinc-500 */
      --ink-faint: #52525b; /* zinc-600 */
      --ink-ghost: #3f3f46; /* zinc-700 */
      --red: #ef4444;
      --emerald: #10b981;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --sans: "Inter", -apple-system, "Segoe UI", Arial, sans-serif;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
      color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      background: var(--bg); overflow: hidden;
      font-family: var(--sans);
      -webkit-touch-callout: none;
      touch-action: manipulation;
      overscroll-behavior: none;
    }

    #stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background-color: var(--bg);
      background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 18px 18px;
    }

    /* Die Original-Seiten sind fest auf 800x480 gebaut (siehe .frame in
       jeder Einzelseite) -- statt sie neu zu bauen, laden wir sie 1:1
       als iframes ("Look soll erhalten bleiben") und skalieren den
       kompletten 800x480-Block per JS auf die verfügbare Fläche.
       filter: invert(1) dreht Schwarz/Weiß um, ohne die Seiten selbst
       anzufassen -- exakt das gewünschte "invertiert fürs iPhone". */
    #frameWrap {
      position: relative;
      width: 800px; height: 480px;
      flex-shrink: 0;
      transform-origin: center center;
    }
    iframe.screen {
      position: absolute; inset: 0;
      width: 800px; height: 480px;
      border: 0; display: block;
      background: #fff;
      filter: invert(1);
      pointer-events: none;
      opacity: 0;
      transition: opacity .25s ease;
    }
    iframe.screen.active { opacity: 1; }

    /* HUD-Eckenklammern um die Bühne herum -- skalieren automatisch mit
       (liegen innerhalb von #frameWrap, das transform: scale() trägt),
       bleiben also immer proportional zum Rahmen, wie eine Gerätefassung. */
    .stage-corner { position: absolute; width: 22px; height: 22px; border: 2px solid var(--ink-ghost); pointer-events: none; }
    .stage-corner.tl { top: -14px; left: -14px; border-right: none; border-bottom: none; }
    .stage-corner.tr { top: -14px; right: -14px; border-left: none; border-bottom: none; }
    .stage-corner.bl { bottom: -14px; left: -14px; border-right: none; border-top: none; }
    .stage-corner.br { bottom: -14px; right: -14px; border-left: none; border-top: none; }

    /* Tap-Feedback: kurzer Puls beim Antippen -- ersetzt fehlendes
       haptisches Feedback im Browser durch eine sichtbare Bestätigung. */
    .tap-pulse {
      position: fixed; z-index: 20; pointer-events: none;
      width: 64px; height: 64px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.5);
      transform: translate(-50%, -50%) scale(0.4);
      opacity: 0;
    }
    .tap-pulse.animate { animation: tapPulse .4s ease-out forwards; }
    @keyframes tapPulse {
      0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
    }

    /* Unsichtbare Tap-Zonen über allem -- links/rechts blättern manuell,
       Mitte schaltet Play/Pause. Liegen über den iframes (die selbst
       pointer-events:none haben), damit kein Tap versehentlich mit der
       Originalseite interagiert (z.B. Standort-Button in A.L.V.I.N.html). */
    #tapZones { position: fixed; inset: 0; display: flex; z-index: 5; }
    #tapZones > div { flex: 1 1 0; }

    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor-blink { animation: blink 1s step-start infinite; }

    @keyframes pulse-glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .live-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
      background: var(--red); box-shadow: 0 0 8px rgba(239,68,68,0.6);
      animation: pulse-glow 1.6s ease-in-out infinite;
    }
    .live-dot.calm { background: var(--ink-ghost); box-shadow: none; animation: none; }

    /* ---- Persistenter Status-Streifen oben: bleibt immer sichtbar
       (dezent), damit Rotationsstatus & Position auch ohne Tap sofort
       ablesbar sind -- analog zur Topbar in control.html. ---- */
    #topStrip {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      padding: calc(8px + var(--safe-t)) calc(14px + var(--safe-r)) 8px calc(14px + var(--safe-l));
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--ink-label);
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
      pointer-events: none;
    }
    #topStrip .brand { display: flex; align-items: center; gap: 7px; color: var(--ink-faint); }
    #topStrip .brand b { color: var(--ink-dim); font-weight: 500; letter-spacing: 0.2em; }
    #topStrip .status { display: flex; align-items: center; gap: 7px; }
    #topStrip .status.calm { color: var(--ink-faint); }
    #topStrip .status.live { color: var(--red); }
    #topStrip .counter { color: var(--ink-faint); }

    /* ---- Steuerleiste unten: liegt über dem Content, blendet nach
       Inaktivität aus, damit möglichst viel vom Screen sichtbar bleibt.
       Sharp/eckige Buttons statt Kreise, Eckenklammern-Panel -- gleiche
       Sprache wie .ow-panel/.cta-btn in control.html. ---- */
    #hud {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      padding: 12px calc(14px + var(--safe-r)) calc(12px + var(--safe-b)) calc(14px + var(--safe-l));
      background: linear-gradient(to top, rgba(0,0,0,0.94), rgba(0,0,0,0.6) 65%, transparent);
      opacity: 0; pointer-events: none;
      transition: opacity .3s ease;
    }
    #hud.visible { opacity: 1; pointer-events: auto; }

    #hudPanel { position: relative; border: 1px solid var(--line); background: var(--panel); padding: 10px 12px; }
    .corner { position: absolute; width: 9px; height: 9px; border: 1px solid var(--ink-ghost); pointer-events: none; }
    .corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .corner.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
    .corner.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
    .corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

    #hudRow { display: flex; align-items: center; gap: 10px; }
    .hud-btn {
      flex-shrink: 0; width: 44px; height: 44px;
      border: 1px solid var(--line); background: transparent;
      color: var(--ink-dim); font-size: 15px; font-family: var(--mono);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: border-color .15s, background-color .15s, color .15s;
    }
    .hud-btn:active { background: var(--ink); border-color: var(--ink); color: #000; }
    #hudInfo { flex: 1; min-width: 0; }
    #hudLabel {
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em;
      color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #hudWake {
      display: flex; align-items: center; gap: 6px; margin-top: 3px;
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint);
    }
    .wake-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--emerald); flex-shrink: 0; }
    .wake-dot.off { background: var(--ink-ghost); }

    #progressTrack {
      margin-top: 10px; height: 2px; width: 100%;
      background: var(--line-soft); overflow: hidden;
    }
    #progressFill {
      height: 100%; width: 0%; background: var(--ink);
      animation: fillBar 120s linear forwards;
      animation-play-state: paused;
    }
    @keyframes fillBar { from { width: 0%; } to { width: 100%; } }

    #dots { display: flex; justify-content: center; gap: 7px; margin-top: 10px; flex-wrap: wrap; }
    .dot {
      width: 5px; height: 5px; background: var(--ink-ghost);
      padding: 7px; margin: -7px; background-clip: content-box;
      cursor: pointer;
    }
    .dot.active { background: var(--ink); background-clip: content-box; }

    #hint {
      position: fixed; left: 0; right: 0; z-index: 15;
      top: calc(38px + var(--safe-t));
      text-align: center; color: var(--ink-body); opacity: 0;
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
      transition: opacity .3s ease; pointer-events: none;
    }
    #hint.visible { opacity: 1; }

    /* ---- Einmaliger Hinweis: "Zum Home-Bildschirm hinzufügen" für den
       randlosen Vollbildmodus ohne Safari-Leiste. ---- */
    #a2hs {
      position: fixed; left: 14px; right: 14px; z-index: 20;
      bottom: calc(14px + var(--safe-b));
      border: 1px solid var(--line); background: var(--panel);
      padding: 12px 14px; display: flex; align-items: center; gap: 12px;
      transform: translateY(140%); transition: transform .35s ease;
    }
    #a2hs.visible { transform: translateY(0); }
    #a2hs p { margin: 0; font-size: 12px; color: var(--ink-body); line-height: 1.5; flex: 1; }
    #a2hs p b { color: var(--ink-dim); font-weight: 500; }
    #a2hs button {
      flex-shrink: 0; border: 1px solid var(--line); background: transparent; color: var(--ink-faint);
      font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
      padding: 8px 12px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="frameWrap">
      <span class="stage-corner tl"></span><span class="stage-corner tr"></span>
      <span class="stage-corner bl"></span><span class="stage-corner br"></span>
    </div>
  </div>

  <div id="topStrip">
    <span class="brand"><b>R.U.D.I.</b> SCREENS</span>
    <span class="status calm" id="topStatus"><span class="live-dot calm" id="topDot"></span><span id="topStatusText">ROTATING</span></span>
    <span class="counter" id="topCounter">1/12</span>
  </div>

  <div id="hint">Tippen: vor/zurück &middot; Mitte: Pause</div>

  <div id="tapZones">
    <div id="tapPrev"></div>
    <div id="tapPlay"></div>
    <div id="tapNext"></div>
  </div>

  <div id="hud">
    <div id="hudPanel">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <div id="hudRow">
        <button class="hud-btn" id="btnPrev" title="Zurück">&#8249;</button>
        <button class="hud-btn" id="btnPlay" title="Pause/Play">&#10074;&#10074;</button>
        <button class="hud-btn" id="btnNext" title="Weiter">&#8250;</button>
        <div id="hudInfo">
          <div id="hudLabel">Laden…</div>
          <div id="hudWake"><span class="wake-dot" id="wakeDot"></span><span id="wakeText">Display bleibt an</span></div>
        </div>
      </div>
      <div id="progressTrack"><div id="progressFill"></div></div>
      <div id="dots"></div>
    </div>
  </div>

  <div id="a2hs">
    <p>Für randloses Vollbild: unten <b>Teilen</b> &rarr; <b>Zum Home-Bildschirm</b>.</p>
    <button id="a2hsClose">Ok</button>
  </div>

  <script>
    "use strict";

    // Reihenfolge frei wählbar -- Reihenfolge hier: allgemeines zuerst,
    // dann alles rund ums Fliegen zusammen, dann Gleitschirm/Wetter,
    // Pizza zum Schluss.
    const SCREENS = [
      { file: "weather.html", label: "Wetter & Familie" },
      { file: "warnings.html", label: "Wetterwarnung" },
      { file: "traffic.html", label: "Flugliste" },
      { file: "approach.html", label: "Anflug-Radar" },
      { file: "A.L.V.I.N.html", label: "Flugradar" },
      { file: "military.html", label: "Militärflugzeuge" },
      { file: "paragliding.html", label: "Gleitschirm & Segelflug" },
      { file: "paragliderslive.html", label: "Gleitschirm Live" },
      { file: "chiemsee.html", label: "Chiemsee" },
      { file: "snow.html", label: "Schneebericht" },
      { file: "training.html", label: "Training" },
      { file: "pizza.html", label: "Pizza-Bilanz" },
    ];

    const ROTATE_MS = 120000; // 2 Minuten
    const FRAME_W = 800, FRAME_H = 480;

    const frameWrap = document.getElementById("frameWrap");
    const hud = document.getElementById("hud");
    const hint = document.getElementById("hint");
    const hudLabel = document.getElementById("hudLabel");
    const wakeDot = document.getElementById("wakeDot");
    const wakeText = document.getElementById("wakeText");
    const btnPlay = document.getElementById("btnPlay");
    const progressFill = document.getElementById("progressFill");
    const dotsWrap = document.getElementById("dots");
    const topStatus = document.getElementById("topStatus");
    const topDot = document.getElementById("topDot");
    const topStatusText = document.getElementById("topStatusText");
    const topCounter = document.getElementById("topCounter");

    let current = 0;
    let playing = true;
    let timer = null;
    let hideHudTimer = null;

    // --- Skalierung: die feste 800x480-Bühne auf die verfügbare Fläche
    // (egal ob iPhone-Hochformat, Querformat, iPad, Desktop-Fenster...)
    // passend einpassen, Seitenverhältnis bleibt erhalten. ---
    function updateScale() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const scale = Math.min(vw / FRAME_W, vh / FRAME_H);
      frameWrap.style.transform = `scale(${scale})`;
    }
    updateScale();
    window.addEventListener("resize", updateScale);
    window.addEventListener("orientationchange", () => setTimeout(updateScale, 300));
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", updateScale);
    }

    // --- Alle Screens als iframes vorladen (bleiben im Hintergrund
    // aktiv, holen also weiter ihre Daten), nur der aktive ist sichtbar
    // -- so ist beim Umschalten sofort "alles da", kein Nachladen. ---
    const iframes = SCREENS.map((screen, index) => {
      const el = document.createElement("iframe");
      el.className = "screen";
      el.src = screen.file;
      el.loading = index === 0 ? "eager" : "lazy";
      frameWrap.appendChild(el);
      return el;
    });

    SCREENS.forEach((_, index) => {
      const dot = document.createElement("div");
      dot.className = "dot";
      dot.addEventListener("click", (e) => { e.stopPropagation(); goTo(index); });
      dotsWrap.appendChild(dot);
    });
    const dots = Array.from(dotsWrap.children);

    function render() {
      iframes.forEach((el, i) => el.classList.toggle("active", i === current));
      dots.forEach((d, i) => d.classList.toggle("active", i === current));
      hudLabel.textContent = SCREENS[current].label;
      topCounter.textContent = `${current + 1}/${SCREENS.length}`;
      restartProgressBar();
    }

    function restartProgressBar() {
      progressFill.style.animation = "none";
      // Reflow erzwingen, damit die Animation beim erneuten Setzen
      // wirklich von vorne beginnt statt einfach weiterzulaufen.
      void progressFill.offsetWidth;
      progressFill.style.animation = `fillBar ${ROTATE_MS / 1000}s linear forwards`;
      progressFill.style.animationPlayState = playing ? "running" : "paused";
    }

    function goTo(index) {
      current = ((index % SCREENS.length) + SCREENS.length) % SCREENS.length;
      render();
      if (playing) startTimer();
    }
    function next() { goTo(current + 1); }
    function prev() { goTo(current - 1); }

    function startTimer() {
      stopTimer();
      timer = setInterval(next, ROTATE_MS);
    }
    function stopTimer() {
      if (timer) clearInterval(timer);
      timer = null;
    }

    function setPlaying(value) {
      playing = value;
      btnPlay.innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
      if (playing) startTimer(); else stopTimer();
      progressFill.style.animationPlayState = playing ? "running" : "paused";

      topStatus.className = "status" + (playing ? " live" : " calm");
      topDot.className = "live-dot" + (playing ? "" : " calm");
      topStatusText.textContent = playing ? "ROTATING" : "PAUSED";
    }

    function showHud() {
      hud.classList.add("visible");
      clearTimeout(hideHudTimer);
      hideHudTimer = setTimeout(() => hud.classList.remove("visible"), 4000);
    }

    // Sichtbare Bestätigung beim Antippen (kein Haptik-Feedback im
    // Browser verfügbar) -- kurzer Ring an der Tap-Position.
    function pulseAt(x, y) {
      const el = document.createElement("div");
      el.className = "tap-pulse";
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      document.body.appendChild(el);
      requestAnimationFrame(() => el.classList.add("animate"));
      setTimeout(() => el.remove(), 450);
    }

    function bindTapZone(el, action) {
      el.addEventListener("click", (e) => {
        pulseAt(e.clientX, e.clientY);
        action();
        showHud();
      });
    }

    bindTapZone(document.getElementById("tapPrev"), prev);
    bindTapZone(document.getElementById("tapNext"), next);
    bindTapZone(document.getElementById("tapPlay"), () => setPlaying(!playing));

    document.getElementById("btnPrev").addEventListener("click", (e) => { e.stopPropagation(); prev(); showHud(); });
    document.getElementById("btnNext").addEventListener("click", (e) => { e.stopPropagation(); next(); showHud(); });
    document.getElementById("btnPlay").addEventListener("click", (e) => { e.stopPropagation(); setPlaying(!playing); showHud(); });

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") { prev(); showHud(); }
      else if (e.key === "ArrowRight") { next(); showHud(); }
      else if (e.key === " ") { e.preventDefault(); setPlaying(!playing); showHud(); }
    });

    // Kurzer Hinweis beim ersten Laden, verschwindet nach 4s.
    hint.classList.add("visible");
    setTimeout(() => hint.classList.remove("visible"), 4000);

    setPlaying(true);
    render();
    showHud();

    // --- "Zum Home-Bildschirm hinzufügen"-Hinweis: nur auf iPhone, nur
    // wenn nicht schon im Standalone-Modus (Home-Bildschirm-App) offen,
    // und nur einmal (per localStorage gemerkt). ---
    (function maybeShowA2HS() {
      const isIphone = /iphone/i.test(navigator.userAgent);
      const isStandalone = window.navigator.standalone === true;
      let dismissed = false;
      try { dismissed = localStorage.getItem("rudi-a2hs-dismissed") === "1"; } catch (error) { /* Privater Modus o.ä. -- dann eben jedes Mal zeigen */ }
      if (!isIphone || isStandalone || dismissed) return;

      const banner = document.getElementById("a2hs");
      setTimeout(() => banner.classList.add("visible"), 1500);
      document.getElementById("a2hsClose").addEventListener("click", (e) => {
        e.stopPropagation();
        banner.classList.remove("visible");
        try { localStorage.setItem("rudi-a2hs-dismissed", "1"); } catch (error) { /* ignorieren */ }
      });
    })();

    // --- Wake Lock: iPhone soll bei offener Seite nicht einschlafen.
    // Screen Wake Lock API (Safari ab iOS 16.4). Wird beim Schlafen/
    // Tab-Wechsel vom System selbst freigegeben -- bei Rückkehr in den
    // Vordergrund hier erneut anfordern. ---
    let wakeLock = null;

    function setWakeStatus(active, text) {
      wakeDot.className = "wake-dot" + (active ? "" : " off");
      wakeText.textContent = text;
    }

    async function requestWakeLock() {
      if (!("wakeLock" in navigator)) {
        setWakeStatus(false, "Wake Lock nicht unterstützt");
        return;
      }
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        setWakeStatus(true, "Display bleibt an");
        wakeLock.addEventListener("release", () => {
          setWakeStatus(false, "Display-Sperre inaktiv");
        });
      } catch (error) {
        setWakeStatus(false, "Display bleibt an: nicht möglich");
        console.error(error);
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") requestWakeLock();
    });

    requestWakeLock();
  </script>
</body>
</html>
