<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Anflug-Radar</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700;800&family=Roboto+Mono:wght@400;500;700&display=swap"
  rel="stylesheet"
/>

<style>
  :root { --black: #fff; --white: #000; }
  * { box-sizing: border-box; -webkit-font-smoothing: none; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--white); color: var(--black); font-family: "Work Sans", Arial, Helvetica, sans-serif; }
  .frame { position: relative; width: 800px; height: 480px; overflow: hidden; background: var(--white); border: 1px solid var(--black); }
  .header {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 14px 20px 8px; border-bottom: 1px solid var(--black);
  }
  .brand { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.22em; }
  .subtitle { margin: 4px 0 0; font-size: 11px; line-height: 1.1; font-family: "Roboto Mono", ui-monospace, Menlo, monospace; }
  .live-badge { text-align: right; font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin: 0; }
  .live-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--black); margin-right: 5px; vertical-align: middle; }
  .header-right { display: flex; flex-direction: row; align-items: center; gap: 8px; }
  .position-select {
    appearance: none; -webkit-appearance: none;
    font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 8.5px;
    color: var(--black); background: var(--white);
    border: 1px solid var(--black); border-radius: 3px; padding: 2px 14px 2px 5px;
    background-image: linear-gradient(45deg, transparent 50%, var(--black) 50%), linear-gradient(135deg, var(--black) 50%, transparent 50%);
    background-position: right 6px center, right 3px center; background-size: 3px 3px, 3px 3px; background-repeat: no-repeat;
  }

  .main-layout { display: flex; height: 400px; }
  .radar-wrap { flex: 0 0 300px; display: flex; justify-content: center; align-items: center; border-right: 1px solid var(--black); }
  #radarSvg, .radar-wrap svg { width: 280px; height: 280px; display: block; }

  .rows { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .row {
    display: grid;
    grid-template-columns: 22px 34px 1fr 64px 72px 18px;
    gap: 0 8px;
    align-items: center;
    padding: 6px 14px;
    border-bottom: 1px solid var(--black);
    flex: 1 1 0;
    min-height: 0;
  }
  .row:last-child { border-bottom: none; }
  .row-num {
    width: 18px; height: 18px; border-radius: 50%; background: var(--black); color: var(--white);
    display: flex; align-items: center; justify-content: center;
    font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 9px; font-weight: 700;
  }
  .thumb { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .thumb img { max-width: 32px; max-height: 32px; object-fit: contain; }
  .thumb-fallback {
    width: 32px; height: 32px; border: 1px solid var(--black); border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 6.5px; font-weight: 700; text-align: center; line-height: 1.1;
  }
  .flight-block { display: flex; flex-direction: column; gap: 0; min-width: 0; }
  .flight-id { font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; }
  .flight-meta { font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; }
  .dir-block { display: flex; flex-direction: column; align-items: flex-end; gap: 0; }
  .dir-value { font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 700; margin: 0; }
  .dir-label { font-size: 8px; letter-spacing: 0.04em; margin: 0; }
  .eta-block { display: flex; flex-direction: column; align-items: flex-end; gap: 0; }
  .eta-time { font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 800; margin: 0; }
  .eta-label { font-size: 8px; letter-spacing: 0.04em; margin: 0; }
  .star { font-size: 15px; text-align: center; }

  .footer {
    position: absolute; left: 20px; right: 20px; bottom: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding-top: 7px; border-top: 1px solid var(--black);
    font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 8px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1;
  }
  .empty { padding: 30px 20px; text-align: center; font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 11px; }
</style>
</head>
<body>
  <div class="frame">
    <header class="header">
      <div>
        <p class="brand">Anflug-Radar</p>
        <p class="subtitle">Wer kommt als nächstes vorbei</p>
      </div>
      <div class="header-right">
        <select id="positionSelect" class="position-select" aria-label="Ziel">
          <option value="grassau">Grassau</option>
          <option value="ismaning">Ismaning</option>
        </select>
        <p class="live-badge"><span class="live-dot"></span>LIVE</p>
      </div>
    </header>

    <div class="main-layout">
      <div class="radar-wrap" id="radarWrap"></div>
      <section class="rows" id="rows">
        <div class="empty">Loading aircraft...</div>
      </section>
    </div>

    <footer class="footer">
      <span id="footerNote">Loading…</span>
      <span id="updatedAt">Updating</span>
    </footer>
  </div>

  <script>
    const API_BASE = "https://rudi.marvinradar.workers.dev/flights";
    const RUDI_WORKER = "https://rudi.marvinradar.workers.dev";
    const MAX_ROWS = 5;
    const REFRESH_INTERVAL_MS = 300000;

    const TARGET_MAP = {
      grassau: { lat: 47.7756389, lon: 12.4551944, label: "Grassau" },
      ismaning: { lat: 48.226, lon: 11.674, label: "Ismaning" },
    };
    let selectedTargetKey = "grassau";

    const APPROACH_RADIUS_KM = 60;
    const MAX_ALTITUDE_M = 3000;
    const LOOKAHEAD_MINUTES = 60;
    const RADAR_RINGS_KM = [20, 40, 60];

    const radarWrap = document.getElementById("radarWrap");
    const rowsEl = document.getElementById("rows");
    const footerNote = document.getElementById("footerNote");
    const updatedAt = document.getElementById("updatedAt");

    function radians(deg) { return (deg * Math.PI) / 180; }
    function haversineKm(a, b) {
      const earthRadiusKm = 6371.0088;
      const deltaLat = radians(b.lat - a.lat);
      const deltaLon = radians(b.lon - a.lon);
      const latitudeA = radians(a.lat);
      const latitudeB = radians(b.lat);
      const value = Math.sin(deltaLat / 2) ** 2 + Math.cos(latitudeA) * Math.cos(latitudeB) * Math.sin(deltaLon / 2) ** 2;
      return 2 * earthRadiusKm * Math.asin(Math.sqrt(value));
    }
    function numericOrNull(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }
    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function project(lat, lon, center, scalePxPerKm) {
      const kmPerDegLat = 111, kmPerDegLon = 111 * Math.cos((center.lat * Math.PI) / 180);
      const dxKm = (lon - center.lon) * kmPerDegLon, dyKm = (lat - center.lat) * kmPerDegLat;
      return { x: dxKm * scalePxPerKm, y: -dyKm * scalePxPerKm };
    }

    function bearingDeg(from, to) {
      const lat1 = radians(from.lat), lat2 = radians(to.lat);
      const dLon = radians(to.lon - from.lon);
      const y = Math.sin(dLon) * Math.cos(lat2);
      const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
      return ((Math.atan2(y, x) * 180) / Math.PI + 360) % 360;
    }
    function compassLabel(deg) {
      const dirs = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
      return dirs[Math.round((deg % 360) / 45) % 8];
    }

    function projectPosition(lat, lon, trackDeg, groundSpeedKt, minutesAhead) {
      const speedKmh = groundSpeedKt * 1.852;
      const distanceKm = speedKmh * (minutesAhead / 60);
      const trackRad = (trackDeg * Math.PI) / 180;
      const dLatKm = distanceKm * Math.cos(trackRad);
      const dLonKm = distanceKm * Math.sin(trackRad);
      return {
        lat: lat + dLatKm / 111,
        lon: lon + dLonKm / (111 * Math.cos((lat * Math.PI) / 180)),
      };
    }

    function findClosestApproach(item, target) {
      let best = { distanceKm: Infinity, minutesAhead: null };
      if (item.speed === null || item.track === null || item.speed < 30) return best;
      for (let m = 1; m <= LOOKAHEAD_MINUTES; m++) {
        const projected = projectPosition(item.lat, item.lon, item.track, item.speed, m);
        const d = haversineKm(target, projected);
        if (d < best.distanceKm) best = { distanceKm: d, minutesAhead: m };
      }
      return best;
    }

    function airlineIcaoFromCallsign(callsign) {
      const cs = String(callsign || "").trim().toUpperCase();
      const match = cs.match(/^([A-Z]{3})\d/);
      return match ? match[1] : null;
    }

    function normalizeAircraft(raw) {
      const lat = Number(raw.lat);
      const lon = Number(raw.lon);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
      const altBaro = raw.alt_baro;
      const altitude = altBaro === "ground" ? 0 : numericOrNull(altBaro ?? raw.alt_geom);
      return {
        lat, lon,
        callsign: String(raw.flight || "").trim() || null,
        registration: String(raw.r || "").trim() || null,
        type: String(raw.t || "").trim() || null,
        altitude,
        speed: numericOrNull(raw.gs),
        track: numericOrNull(raw.track ?? raw.true_heading ?? raw.mag_heading),
        isMilitary: Boolean(Number(raw.dbFlags) & 1),
        isSpecial: Boolean(raw.isSpecial),
      };
    }

    function renderThumb(item) {
      const airlineIcao = airlineIcaoFromCallsign(item.callsign);
      const effectiveIcao = item.isMilitary ? null : airlineIcao;
      if (effectiveIcao) {
        const tailUrl = `${API_BASE}/airline-logo?icao=${encodeURIComponent(effectiveIcao)}&variant=tail`;
        return `<div class="thumb"><img src="${escapeHtml(tailUrl)}" alt=""
          onerror="this.parentElement.innerHTML='<div class=&quot;thumb-fallback&quot;>${escapeHtml(item.type || "?")}</div>'" /></div>`;
      }
      if (item.type) {
        const silUrl = `${RUDI_WORKER}/flights/silhouette?type=${encodeURIComponent(item.type)}`;
        return `<div class="thumb"><img src="${escapeHtml(silUrl)}" alt=""
          onerror="this.parentElement.innerHTML='<div class=&quot;thumb-fallback&quot;>${escapeHtml(item.type)}</div>'" /></div>`;
      }
      return `<div class="thumb-fallback">?</div>`;
    }

    function formatEtaTime(minutesAhead) {
      const eta = new Date(Date.now() + minutesAhead * 60000);
      return eta.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" });
    }

    function renderRadar(approaches, target) {
      const W = 280, H = 280;
      const maxRadiusPx = Math.min(W, H) / 2 - 14;
      const scale = maxRadiusPx / APPROACH_RADIUS_KM;

      let svg = `<svg viewBox="${-W / 2} ${-H / 2} ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;

      RADAR_RINGS_KM.forEach((km) => {
        const r = km * scale;
        svg += `<circle cx="0" cy="0" r="${r}" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="2 3"/>`;
        svg += `<text x="3" y="${-r - 2}" font-size="7" fill="#fff" font-family="Roboto Mono, monospace">${km}KM</text>`;
      });

      const edge = maxRadiusPx + 8;
      svg += `<text x="0" y="${-edge}" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">N</text>`;
      svg += `<text x="${edge}" y="4" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">E</text>`;
      svg += `<text x="0" y="${edge + 8}" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">S</text>`;
      svg += `<text x="${-edge}" y="4" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">W</text>`;

      svg += `<path d="M-5 0 L5 0 M0 -5 L0 5" stroke="#fff" stroke-width="1.5"/>`;

      approaches.forEach((item, i) => {
        const p = project(item.lat, item.lon, target, scale);
        const distFromCenter = Math.sqrt(p.x ** 2 + p.y ** 2);
        const clampedP = distFromCenter > maxRadiusPx
          ? { x: (p.x / distFromCenter) * maxRadiusPx, y: (p.y / distFromCenter) * maxRadiusPx }
          : p;
        // Kleine Flugzeug-Pfeilform, gedreht auf die tatsächliche
        // Flugrichtung (track) -- zeigt damit direkt, ob das Flugzeug
        // wirklich auf einen zuhält oder nur in der Nähe vorbeifliegt.
        // Form zeigt bei 0° nach oben (Norden), passend zur
        // Kurs-Konvention (0° = Nordkurs).
        const rot = item.track ?? 0;
        svg += `<g transform="translate(${clampedP.x} ${clampedP.y}) rotate(${rot})">
          <path d="M0,-10 L6,7 L0,3 L-6,7 Z" fill="#fff" stroke="#000" stroke-width="1"/>
        </g>`;
        svg += `<text x="${clampedP.x + 13}" y="${clampedP.y + 4}" font-size="10" font-weight="700" text-anchor="middle" fill="#fff" font-family="Roboto Mono, monospace">${i + 1}</text>`;
        if (item.isSpecial) {
          svg += `<text x="${clampedP.x - 13}" y="${clampedP.y + 4}" font-size="11" text-anchor="middle">\u2605</text>`;
        }
      });

      svg += `</svg>`;
      radarWrap.innerHTML = svg;
    }

    function renderApproaches(approaches, targetLabel) {
      if (!approaches.length) {
        rowsEl.innerHTML = `<div class="empty">Kein Flugzeug nähert sich gerade ${escapeHtml(targetLabel)}.</div>`;
        return;
      }
      rowsEl.innerHTML = approaches.map((item, i) => {
        const idLine = item.callsign || item.registration || "—";
        const typeLine = [item.type, item.registration].filter(Boolean).join(" · ") || "Typ unbekannt";
        const etaMinutes = item.approach.minutesAhead;
        const etaLabel = etaMinutes <= 1 ? "GLEICH" : `IN ${etaMinutes} MIN`;
        const bearing = bearingDeg(item.__target, item);

        return `
          <div class="row">
            <div class="row-num">${i + 1}</div>
            ${renderThumb(item)}
            <div class="flight-block">
              <p class="flight-id">${escapeHtml(idLine)}</p>
              <p class="flight-meta">${escapeHtml(typeLine)}</p>
            </div>
            <div class="dir-block">
              <p class="dir-value">${compassLabel(bearing)} · ${item.approach.distanceKm.toFixed(0)}KM</p>
              <p class="dir-label">RICHTUNG</p>
            </div>
            <div class="eta-block">
              <p class="eta-time">${formatEtaTime(etaMinutes)}</p>
              <p class="eta-label">${etaLabel}</p>
            </div>
            <div class="star">${item.isSpecial ? "\u2605" : ""}</div>
          </div>
        `;
      }).join("");
    }

    async function loadDisplay() {
      try {
        const response = await fetch(`${API_BASE}/aircraft`, {
          headers: { Accept: "application/json" }, cache: "no-store",
        });
        if (!response.ok) throw new Error(`Aircraft request failed with HTTP ${response.status}`);
        const payload = await response.json();

        const candidates = (Array.isArray(payload.ac) ? payload.ac : [])
          .map(normalizeAircraft)
          .filter(Boolean)
          .filter((a) => a.altitude !== 0 && a.callsign && a.speed !== null && a.track !== null)
          .filter((a) => a.altitude === null || a.altitude <= MAX_ALTITUDE_M / 0.3048);

        const target = TARGET_MAP[selectedTargetKey];
        const approaches = candidates
          .map((item) => ({ ...item, approach: findClosestApproach(item, target), __target: target }))
          .filter((item) => item.approach.distanceKm <= APPROACH_RADIUS_KM)
          .sort((a, b) => a.approach.minutesAhead - b.approach.minutesAhead)
          .slice(0, MAX_ROWS);

        renderRadar(approaches, target);
        renderApproaches(approaches, target.label);
        footerNote.textContent = `${approaches.length} approaching ${target.label} · radius ${APPROACH_RADIUS_KM}km · below ${MAX_ALTITUDE_M}m`;

        const fetchedAtHeader = response.headers.get("X-MARVIN-Fetched-At");
        updatedAt.textContent = fetchedAtHeader
          ? new Date(fetchedAtHeader).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" })
          : new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" });
      } catch (error) {
        console.error(error);
        radarWrap.innerHTML = "";
        rowsEl.innerHTML = '<div class="empty">Aircraft data unavailable.</div>';
        updatedAt.textContent = "Update failed";
      }
    }

    document.getElementById("positionSelect").addEventListener("change", (event) => {
      selectedTargetKey = event.target.value;
      loadDisplay();
    });

    loadDisplay();
    setInterval(loadDisplay, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
