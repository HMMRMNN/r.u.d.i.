name = "rudi"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Explizit gesetzt, damit wrangler den Account nicht per /memberships-API
# auflösen muss -- der CI-Token hat bewusst nur "Workers Scripts: Edit"
# und keine "Account Settings: Read"-Berechtigung.
account_id = "2457993927c5e73db54e7f11356e20cd"

# KV-Namespace-Binding "RUDI_KV" -> Namespace "rudi-data" im Dashboard.
[[kv_namespaces]]
binding = "RUDI_KV"
id = "5243ab7095fd4e2ead7331ea129f19bd"

# Service Binding zum separaten "aviradar-api"-Worker (siehe
# handleFlightProxy in src/index.js für den Hintergrund: normale
# fetch()-Aufrufe zwischen zwei Workers im selben Account über die
# öffentliche URL scheitern an Cloudflare-Fehler 1042).
[[services]]
binding = "AVIRADAR_API_BINDING"
service = "aviradar-api"

# Zwei Cron-Trigger (siehe scheduled() in src/index.js, das anhand von
# controller.cron unterscheidet, welcher Zeitplan ihn ausgelöst hat).
# Falls im Dashboard unter Settings -> Triggers -> Cron Triggers ein
# anderer Wert eingetragen ist, hier entsprechend anpassen, damit
# wrangler deploy ihn nicht stillschweigend überschreibt.
[triggers]
crons = [
  "0 18 * * *",  # Täglich: Health-Check + Pizza-Fahrterkennung. Zeit in
                 # UTC -- 18:00 UTC ist 20:00 Berlin-Zeit im Sommer bzw.
                 # 19:00 im Winter.
  "*/2 * * * *", # Alle 2 Minuten: Flying-Bulls-/Interessante-Flugzeuge-
                 # Erkennung (checkForInterestingFlight) -- WICHTIG (Fix,
                 # auf Nutzerwunsch): lief bisher nur, wenn cron-job.org
                 # (externer Dienst, dessen Konfiguration wir nicht
                 # sehen) /flightalert/check anstieß -- Verzögerungen
                 # von bis zu 20 Min beim echten Start eines Flying-
                 # Bulls-Flugzeugs waren die Folge. Eigener Cloudflare-
                 # Cron macht das unabhängig von dieser externen
                 # Konfiguration zuverlässig schnell.
]

# Secrets (GITHUB_TOKEN, HOLFUY_KEY, INTERVALS_API_KEY,
# INTERVALS_ATHLETE_ID, PARAGLIDABLE_KEY, TELEGRAM_BOT_TOKEN,
# TELEGRAM_CHAT_ID) stehen bewusst NICHT hier -- die bleiben, wie sie
# im Cloudflare-Dashboard unter Settings -> Variables and secrets
# hinterlegt sind. "wrangler deploy" fasst Secrets nicht an, ändert
# nur Code + die oben stehenden Bindings/Trigger.
