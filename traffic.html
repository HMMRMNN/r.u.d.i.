<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Flugliste</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700;800&family=Roboto+Mono:wght@400;500;700&display=swap"
  rel="stylesheet"
/>

<style>
  :root { --black: #fff; --white: #000; }
  * { box-sizing: border-box; -webkit-font-smoothing: none; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--white); color: var(--black); font-family: "Work Sans", Arial, Helvetica, sans-serif; }
  .frame { position: relative; width: 800px; height: 480px; overflow: hidden; background: var(--white); border: 1px solid var(--black); }
  .header {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 14px 20px 8px; border-bottom: 1px solid var(--black);
  }
  .brand { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.22em; }
  .subtitle { margin: 4px 0 0; font-size: 11px; line-height: 1.1; font-family: "Roboto Mono", ui-monospace, Menlo, monospace; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .position-select {
    appearance: none; -webkit-appearance: none;
    font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 8.5px;
    color: var(--black); background: var(--white);
    border: 1px solid var(--black); border-radius: 3px; padding: 2px 14px 2px 5px;
    background-image: linear-gradient(45deg, transparent 50%, var(--black) 50%), linear-gradient(135deg, var(--black) 50%, transparent 50%);
    background-position: right 6px center, right 3px center; background-size: 3px 3px, 3px 3px; background-repeat: no-repeat;
  }
  .live-badge { text-align: right; font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin: 0; }
  .live-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--black); margin-right: 5px; vertical-align: middle; }

  /* Tabellen-Kopf: technisches, ATC-artiges Raster statt Karten */
  .col-head {
    display: grid;
    grid-template-columns: 44px 150px 66px 72px 58px 140px 40px 20px;
    gap: 0 8px;
    padding: 6px 20px 4px;
    font-family: "Roboto Mono", ui-monospace, Menlo, monospace;
    font-size: 9px; letter-spacing: 0.05em; color: var(--black);
    border-bottom: 1px solid var(--black);
  }
  .col-head span { text-align: right; }
  .col-head span:nth-child(1), .col-head span:nth-child(2), .col-head span:nth-child(6) { text-align: left; }

  .rows { position: relative; height: 358px; overflow: hidden; }
  .row {
    display: grid;
    grid-template-columns: 44px 150px 66px 72px 58px 140px 40px 20px;
    gap: 0 10px;
    align-items: center;
    padding: 6px 20px;
    border-bottom: 1px solid var(--black);
    height: 59px;
    color: var(--black);
  }
  .row:last-child { border-bottom: none; }
  .thumb { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .thumb img { max-width: 38px; max-height: 38px; object-fit: contain; }
  .thumb-fallback {
    width: 38px; height: 38px; border: 1px solid var(--black); border-radius: 3px;
    display: flex; align-items: center; justify-content: center; color: var(--black);
    font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 8px; font-weight: 700; text-align: center; line-height: 1.1;
  }
  .flight-block { display: flex; flex-direction: column; gap: 1px; min-width: 0; color: var(--black); }
  .flight-id { font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--black); margin: 0; }
  .flight-meta { font-size: 12px; color: var(--black); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; }
  .num-block { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; color: var(--black); }
  .num-value { font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 16px; font-weight: 700; color: var(--black); }
  .num-unit { font-size: 10px; letter-spacing: 0.05em; color: var(--black); }
  .trk-block { display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--black); }
  .trk-arrow { font-size: 18px; line-height: 1; color: var(--black); }
  .trk-value { font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 10px; color: var(--black); }
  .dest-block { display: flex; flex-direction: column; gap: 1px; min-width: 0; color: var(--black); }
  .dest-city { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; }
  .dest-phase { font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: 0.04em; margin: 0; }
  .star { font-size: 18px; text-align: center; color: var(--black); }

  .footer {
    position: absolute; left: 20px; right: 20px; bottom: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding-top: 7px; border-top: 1px solid var(--black);
    font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 8px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1;
  }
  .empty { padding: 40px 20px; text-align: center; font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 11px; }
</style>
</head>
<body>
  <div class="frame">
    <header class="header">
      <div>
        <p class="brand">Flugliste</p>
        <p class="subtitle">Alle Bewegungen im Umkreis</p>
      </div>
      <div class="header-right">
        <select id="positionSelect" class="position-select" aria-label="Sortierung">
          <option value="grassau">Grassau</option>
          <option value="ismaning">Ismaning</option>
        </select>
        <p class="live-badge"><span class="live-dot"></span>LIVE</p>
      </div>
    </header>

    <div class="col-head">
      <span></span>
      <span>KENNUNG / TYP</span>
      <span>ALT</span>
      <span>GS</span>
      <span>VS</span>
      <span>ZIEL</span>
      <span>TRK</span>
      <span></span>
    </div>

    <section class="rows" id="rows">
      <div class="empty">Loading aircraft...</div>
    </section>

    <footer class="footer">
      <span id="footerNote">Loading…</span>
      <span id="updatedAt">Updating</span>
    </footer>
  </div>

  <script>
    const API_BASE = "https://rudi.marvinradar.workers.dev/flights";
    const RUDI_WORKER = "https://rudi.marvinradar.workers.dev";
    const MAX_ROWS = 6;
    const REFRESH_INTERVAL_MS = 300000;

    const POSITIONS = {
      grassau: { lat: 47.7756389, lon: 12.4551944, label: "Grassau" },
      ismaning: { lat: 48.226, lon: 11.674, label: "Ismaning" },
    };
    let sortKey = "grassau";

    const rowsEl = document.getElementById("rows");
    const footerNote = document.getElementById("footerNote");
    const updatedAt = document.getElementById("updatedAt");

    function radians(deg) { return (deg * Math.PI) / 180; }
    function haversineKm(a, b) {
      const earthRadiusKm = 6371.0088;
      const deltaLat = radians(b.lat - a.lat);
      const deltaLon = radians(b.lon - a.lon);
      const latitudeA = radians(a.lat);
      const latitudeB = radians(b.lat);
      const value = Math.sin(deltaLat / 2) ** 2 + Math.cos(latitudeA) * Math.cos(latitudeB) * Math.sin(deltaLon / 2) ** 2;
      return 2 * earthRadiusKm * Math.asin(Math.sqrt(value));
    }
    function numericOrNull(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }
    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // Gleiche Airline-Erkennung wie bei A.L.V.I.N. (display.html) --
    // Rufzeichen-Präfix -> ICAO-Airline-Code für den Tail-Logo-Abruf.
    function airlineIcaoFromCallsign(callsign) {
      const cs = String(callsign || "").trim().toUpperCase();
      const match = cs.match(/^([A-Z]{3})\d/);
      return match ? match[1] : null;
    }

    function normalizeAircraft(raw) {
      const lat = Number(raw.lat);
      const lon = Number(raw.lon);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
      const altBaro = raw.alt_baro;
      const altitude = altBaro === "ground" ? 0 : numericOrNull(altBaro ?? raw.alt_geom);
      return {
        lat, lon,
        callsign: String(raw.flight || "").trim() || null,
        registration: String(raw.r || "").trim() || null,
        type: String(raw.t || "").trim() || null,
        operator: raw.ownOp ? String(raw.ownOp).trim() : null,
        altitude,
        speed: numericOrNull(raw.gs),
        verticalRate: numericOrNull(raw.baro_rate ?? raw.geom_rate),
        track: numericOrNull(raw.track ?? raw.true_heading ?? raw.mag_heading),
        isMilitary: Boolean(Number(raw.dbFlags) & 1),
        isSpecial: Boolean(raw.isSpecial),
      };
    }

    function renderThumb(item) {
      const airlineIcao = airlineIcaoFromCallsign(item.callsign);
      const effectiveIcao = item.isMilitary ? null : airlineIcao;
      if (effectiveIcao) {
        const tailUrl = `${API_BASE}/airline-logo?icao=${encodeURIComponent(effectiveIcao)}&variant=tail`;
        return `<div class="thumb"><img src="${escapeHtml(tailUrl)}" alt=""
          onerror="this.parentElement.innerHTML='<div class=&quot;thumb-fallback&quot;>${escapeHtml(item.type || "?")}</div>'" /></div>`;
      }
      // Kein Airline-Tail (Militär, GA, Flying Bulls etc.) -- Silhouette
      // vom selben Proxy wie military-radar.html, mit Text-Fallback.
      if (item.type) {
        const silUrl = `${RUDI_WORKER}/flights/silhouette?type=${encodeURIComponent(item.type)}`;
        return `<div class="thumb"><img src="${escapeHtml(silUrl)}" alt=""
          onerror="this.parentElement.innerHTML='<div class=&quot;thumb-fallback&quot;>${escapeHtml(item.type)}</div>'" /></div>`;
      }
      return `<div class="thumb-fallback">?</div>`;
    }

    function trackArrow(track) {
      if (track === null) return "–";
      // Acht Himmelsrichtungs-Pfeile, grob gerundet.
      const arrows = ["↑", "↗", "→", "↘", "↓", "↙", "←", "↖"];
      const idx = Math.round(track / 45) % 8;
      return arrows[idx];
    }

    /**
     * Steig-/Sinkrate als Spotter-relevante Phase -- verrät, ob ein
     * Flugzeug gerade abhebt/landet oder im Reiseflug ist, ohne dass man
     * die reine Zahl selbst interpretieren muss.
     */
    function verticalPhase(verticalRateFtMin) {
      if (verticalRateFtMin === null) return { arrow: "", label: "–" };
      const mps = verticalRateFtMin * 0.00508;
      if (verticalRateFtMin > 200) return { arrow: "\u2191", label: `+${mps.toFixed(1)}` };
      if (verticalRateFtMin < -200) return { arrow: "\u2193", label: `${mps.toFixed(1)}` };
      return { arrow: "\u2192", label: "LVL" };
    }

    function cityOnly(value) {
      if (!value) return null;
      const text = String(value).trim()
        .replace(/\s+International Airport$/i, "")
        .replace(/\s+Airport$/i, "")
        .replace(/\s+International$/i, "")
        .trim();
      return text.includes(",") ? text.split(",")[0].trim() : text;
    }
    function extractFirst(...values) {
      for (const value of values) {
        if (value !== null && value !== undefined && String(value).trim() !== "") return String(value).trim();
      }
      return null;
    }

    // Leichte Routen-Abfrage nur für die tatsächlich angezeigten Zeilen
    // (nicht alle ~170 Flugzeuge) -- dieselbe Route wird serverseitig
    // 24h gecacht (siehe rudi-worker.js), daher meist schnelle
    // Antworten ab dem zweiten Abruf.
    async function fetchDestination(callsign) {
      if (!callsign) return null;
      try {
        const response = await fetch(`${API_BASE}/route?callsign=${encodeURIComponent(callsign)}`, {
          headers: { Accept: "application/json" }, cache: "no-store",
        });
        if (!response.ok) return null;
        const data = await response.json();
        const route = data?.route || null;
        if (!route) return null;
        return cityOnly(extractFirst(
          route?.destination?.municipality, route?.arrival?.municipality,
          route?.destination?.name, route?.arrival?.name
        ));
      } catch (error) {
        return null;
      }
    }


    function renderAircraft(aircraft) {
      if (!aircraft.length) {
        rowsEl.innerHTML = '<div class="empty">No aircraft in range.</div>';
        return;
      }
      rowsEl.innerHTML = aircraft.map((item) => {
        const altitudeM = item.altitude !== null ? Math.round(item.altitude * 0.3048) : null;
        const speedKmh = item.speed !== null ? Math.round(item.speed * 1.852) : null;
        const idLine = item.callsign || item.registration || "—";
        const typeLine = [item.type, item.registration].filter(Boolean).join(" · ") || "Typ unbekannt";
        const phase = verticalPhase(item.verticalRate);

        return `
          <div class="row">
            ${renderThumb(item)}
            <div class="flight-block">
              <p class="flight-id">${escapeHtml(idLine)}</p>
              <p class="flight-meta">${escapeHtml(typeLine)}</p>
            </div>
            <div class="num-block">
              <span class="num-value">${altitudeM !== null ? altitudeM.toLocaleString("de-DE") : "–"}</span>
              <span class="num-unit">M</span>
            </div>
            <div class="num-block">
              <span class="num-value">${speedKmh !== null ? speedKmh : "–"}</span>
              <span class="num-unit">KM/H</span>
            </div>
            <div class="num-block">
              <span class="num-value">${phase.arrow}</span>
              <span class="num-unit">${escapeHtml(phase.label)}</span>
            </div>
            <div class="dest-block">
              <p class="dest-city">${escapeHtml(item.destinationCity || "\u2013")}</p>
              <p class="dest-phase">${item.destinationCity ? "ZIEL" : "unbekannt"}</p>
            </div>
            <div class="trk-block">
              <span class="trk-arrow">${trackArrow(item.track)}</span>
              <span class="trk-value">${item.track !== null ? Math.round(item.track).toString().padStart(3, "0") : "---"}</span>
            </div>
            <div class="star">${item.isSpecial ? "\u2605" : ""}</div>
          </div>
        `;
      }).join("");
    }

    async function loadDisplay() {
      try {
        const response = await fetch(`${API_BASE}/aircraft`, {
          headers: { Accept: "application/json" }, cache: "no-store",
        });
        if (!response.ok) throw new Error(`Aircraft request failed with HTTP ${response.status}`);
        const payload = await response.json();

        const refPoint = POSITIONS[sortKey];
        const shortlist = (Array.isArray(payload.ac) ? payload.ac : [])
          .map(normalizeAircraft)
          .filter(Boolean)
          .filter((a) => a.altitude !== 0 && a.callsign)
          .map((a) => ({ ...a, sortDistanceKm: haversineKm(refPoint, a) }))
          .sort((a, b) => a.sortDistanceKm - b.sortDistanceKm)
          .slice(0, MAX_ROWS);

        // Ziele nur für die tatsächlich angezeigten Zeilen abfragen,
        // nicht für alle ~170 Flugzeuge im Datensatz.
        const aircraft = await Promise.all(
          shortlist.map(async (item) => ({ ...item, destinationCity: await fetchDestination(item.callsign) }))
        );

        renderAircraft(aircraft);
        footerNote.textContent = `${aircraft.length} of ${payload.total ?? "?"} tracked · sorted by ${POSITIONS[sortKey].label}`;

        const fetchedAtHeader = response.headers.get("X-MARVIN-Fetched-At");
        updatedAt.textContent = fetchedAtHeader
          ? new Date(fetchedAtHeader).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" })
          : new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" });
      } catch (error) {
        console.error(error);
        rowsEl.innerHTML = '<div class="empty">Aircraft data unavailable.</div>';
        updatedAt.textContent = "Update failed";
      }
    }

    document.getElementById("positionSelect").addEventListener("change", (event) => {
      sortKey = event.target.value;
      loadDisplay();
    });

    loadDisplay();
    setInterval(loadDisplay, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
