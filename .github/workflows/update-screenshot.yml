name: Update E-Ink Screenshot

on:
  schedule:
    # Alle 15 Minuten, nur tagsüber (7-23 Uhr MEZ = 6-22 Uhr UTC im Winter,
    # 5-21 Uhr UTC im Sommer -- großzügig 5-22 UTC gewählt, damit es das
    # ganze Jahr über passt; nachts spart GitHub Actions dann automatisch)
    - cron: "*/15 5-22 * * *"
  workflow_dispatch: {}   # erlaubt manuelles Auslösen zum Testen

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dependencies installieren
        run: |
          pip install playwright pillow
          playwright install --with-deps chromium

      - name: Screenshots erstellen und in 1-Bit BMP wandeln
        env:
          DISPLAYS_API: "https://rudi.marvinradar.workers.dev/displays"
          ROUTE_API: "https://rudi.marvinradar.workers.dev/route"
          FALLBACK_URL: "https://hmmrmnn.github.io/r.u.d.i./weather.html"
        run: |
          python3 << 'EOF'
          import os
          import urllib.request
          import json
          from playwright.sync_api import sync_playwright
          from PIL import Image, ImageEnhance

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "application/json",
          }

          def fetch_json(url, timeout=10):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  return json.loads(resp.read())

          # Welche Displays gibt es? (Registry im Worker, siehe control.html)
          try:
              displays = fetch_json(os.environ["DISPLAYS_API"])
          except Exception as e:
              print(f"Display-Liste nicht erreichbar ({e}), Fallback: nur Hauptdisplay")
              displays = [{"id": "display1", "name": "Hauptdisplay"}]

          WIDTH, HEIGHT = 800, 480

          def render_display(display_id):
              # Fragt den rudi-Worker, welche Seite für DIESES Display gerade
              # dran ist (eigener Override pro Display, gemeinsamer Zeitplan).
              try:
                  route = fetch_json(f"{os.environ['ROUTE_API']}?display={display_id}")
                  url = route["url"]
                  print(f"[{display_id}] Route: {route.get('source')} -> {route.get('label')} -> {url}")
              except Exception as e:
                  url = os.environ["FALLBACK_URL"]
                  print(f"[{display_id}] Route-Abfrage fehlgeschlagen ({e}), Fallback: {url}")

              with sync_playwright() as p:
                  browser = p.chromium.launch()
                  page = browser.new_page(viewport={"width": WIDTH, "height": HEIGHT})
                  page.goto(url, wait_until="networkidle", timeout=30000)

                  # Explizit auf fertig geladene Web-Fonts warten (Work Sans /
                  # Roboto Mono via Google Fonts) -- "networkidle" allein
                  # garantiert nicht, dass der Font-Swap schon passiert ist.
                  try:
                      page.evaluate("document.fonts.ready")
                      page.wait_for_timeout(300)
                  except Exception:
                      pass

                  try:
                      page.wait_for_function(
                          """() => {
                              const el = document.getElementById('aircraftList');
                              return el && !el.textContent.includes('Loading aircraft');
                          }""",
                          timeout=10000,
                      )
                  except Exception:
                      pass

                  raw_path = f"raw_{display_id}.png"
                  page.screenshot(path=raw_path)
                  browser.close()

              img = Image.open(raw_path).convert("L").resize((WIDTH, HEIGHT))

              # Kontrastverstärkung VOR dem Schwellwert: drückt hellgraue,
              # aber eigentlich sichtbar gemeinte Elemente (dünne Trennlinien,
              # abgeschwächter Text mit CSS opacity, Antialiasing-Kanten)
              # systematisch näher an Schwarz oder Weiß.
              img = ImageEnhance.Contrast(img).enhance(2.5)

              # Harter Schwellwert statt Dithering: hält Text/Linien scharf.
              THRESHOLD = 150
              img = img.point(lambda p: 255 if p > THRESHOLD else 0).convert("1")

              # display1 bleibt aus Kompatibilitätsgründen "screen.bmp"
              # (das bestehende Gerät zeigt schon auf diese URL) -- alle
              # weiteren Displays bekommen ihre eigene Datei nach ihrer ID.
              out_name = "screen.bmp" if display_id == "display1" else f"{display_id}.bmp"
              img.save(out_name)
              print(f"[{display_id}] gespeichert als {out_name}")
              os.remove(raw_path)

          for d in displays:
              render_display(d["id"])
          EOF

      - name: Bilder committen (amend nur auf eigene Commits, kein Anfassen des Workflow-Commits)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.bmp

          if git diff --quiet --cached; then
            echo "Kein Bildupdate, nichts zu committen."
          elif [ "$(git log -1 --pretty=%s)" = "Update e-ink screenshot" ]; then
            # Der letzte Commit war schon ein eigener Screenshot-Commit ->
            # sicher zu amenden, enthält garantiert keine Workflow-Datei.
            git commit --amend --no-edit
            git push --force
          else
            # Erster Lauf (oder der letzte Commit war ein manueller/anderer
            # Commit, ggf. mit Workflow-Dateien) -> normaler neuer Commit.
            git commit -m "Update e-ink screenshot"
            git push
          fi
