name: Update E-Ink Screenshot

on:
  schedule:
    # Läuft jetzt rund um die Uhr, alle 15 Minuten. Der Nachtmodus
    # (siehe control.html) wird nicht mehr hier im Cron festgelegt,
    # sondern ist über den Worker frei einstellbar -- der erste Schritt
    # unten prüft das und überspringt bei Bedarf alle teuren Schritte
    # (Playwright-Installation, Chromium-Start), spart also trotzdem
    # GitHub-Minuten, nur eben dynamisch statt fest im Cron verdrahtet.
    # Primärer Trigger ist jetzt cron-job.org (ruft alle 15 Min
    # https://rudi.marvinradar.workers.dev/refresh auf, siehe
    # Projekt-Notizen) -- GitHub's eigener Zeitplan-Trigger ist
    # nachweislich unzuverlässig bei so hoher Frequenz (Abstände von
    # 30-90+ Minuten statt 15 gemessen, 26.08.2026, bekanntes
    # GitHub-Actions-Verhalten bei öffentlichen Free-Tier-Repos).
    # Läuft hier nur noch stündlich als Backup, falls cron-job.org
    # mal ausfällt.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # erlaubt manuelles Auslösen zum Testen

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth: 1 hat dazu geführt, dass der spätere "git commit
          # --amend" den Elternteil des Commits verlor (ein flacher
          # Checkout kennt lokal keinen Parent), wodurch main bei jedem
          # Workflow-Lauf zu einem neuen, elternlosen Root-Commit wurde --
          # das hat wiederholt jede offene PR-Historie zerschossen. Depth 5
          # gibt genug Historie mit, damit amend den echten Parent behält.
          fetch-depth: 5

      - name: Nachtmodus prüfen
        id: check
        run: |
          RESPONSE=$(curl -s -m 10 "https://rudi.marvinradar.workers.dev/route?display=display1" || echo '{}')
          echo "Route-Antwort: $RESPONSE"
          SLEEPING=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print('true' if d.get('sleeping') else 'false')" 2>/dev/null || echo "false")
          echo "sleeping=$SLEEPING" >> "$GITHUB_OUTPUT"
          if [ "$SLEEPING" = "true" ]; then
            echo "Nachtmodus aktiv -- überspringe den Rest des Workflows."
          fi

      - uses: actions/setup-python@v7
        if: steps.check.outputs.sleeping != 'true'
        with:
          python-version: "3.12"

      - name: Dependencies installieren
        if: steps.check.outputs.sleeping != 'true'
        run: |
          pip install playwright pillow
          playwright install --with-deps chromium

      - name: Screenshots erstellen und in 1-Bit BMP wandeln
        if: steps.check.outputs.sleeping != 'true'
        env:
          DISPLAYS_API: "https://rudi.marvinradar.workers.dev/displays"
          ROUTE_API: "https://rudi.marvinradar.workers.dev/route"
          FALLBACK_URL: "https://hmmrmnn.github.io/r.u.d.i./weather.html"
        run: |
          python3 << 'EOF'
          import os
          import urllib.request
          import json
          from playwright.sync_api import sync_playwright
          from PIL import Image, ImageEnhance

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "application/json",
          }

          def fetch_json(url, timeout=10):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  return json.loads(resp.read())

          # Welche Displays gibt es? (Registry im Worker, siehe control.html)
          try:
              displays = fetch_json(os.environ["DISPLAYS_API"])
          except Exception as e:
              print(f"Display-Liste nicht erreichbar ({e}), Fallback: nur Hauptdisplay")
              displays = [{"id": "display1", "name": "Hauptdisplay"}]

          WIDTH, HEIGHT = 800, 480
          # Playwright rendert das Layout in 800x480 CSS-Pixeln, nimmt den
          # Screenshot dank device_scale_factor aber in doppelter Auflösung
          # (1600x960) auf. Erst beim Runterskalieren mit einem hochwertigen
          # Filter entstehen aus Antialiasing-Kanten (Kreise, Rundungen,
          # Verläufe) echte Graustufen-Übergänge -- der harte Schwarz/Weiß-
          # Schwellwert danach sieht dadurch deutlich weniger blockig aus,
          # ohne dass Text unscharf wird.
          SUPERSAMPLE = 2

          def render_display(display_id):
              # Fragt den rudi-Worker, welche Seite für DIESES Display gerade
              # dran ist (eigener Override pro Display, gemeinsamer Zeitplan).
              try:
                  route = fetch_json(f"{os.environ['ROUTE_API']}?display={display_id}")

                  # Nachtmodus gilt zwar global (ein Check oben reicht normalerweise),
                  # aber defensiv auch hier pro Display prüfen -- falls sich das
                  # jemals ändert, überspringt ein einzelnes Display sauber, statt
                  # mit einem fehlenden "url"-Feld abzustürzen.
                  if route.get("sleeping"):
                      print(f"[{display_id}] Nachtmodus aktiv, übersprungen.")
                      return

                  url = route["url"]
                  print(f"[{display_id}] Route: {route.get('source')} -> {route.get('label')} -> {url}")
              except Exception as e:
                  url = os.environ["FALLBACK_URL"]
                  print(f"[{display_id}] Route-Abfrage fehlgeschlagen ({e}), Fallback: {url}")

              with sync_playwright() as p:
                  browser = p.chromium.launch()
                  page = browser.new_page(
                      viewport={"width": WIDTH, "height": HEIGHT},
                      device_scale_factor=SUPERSAMPLE,
                  )
                  # "networkidle" ist hier ungeeignet: Seiten wie traffic.html
                  # laden pro Flugzeug ein Foto von einer externen Fotoquelle
                  # (mit Silhouette-Fallback) -- wenn eine davon lahmt, wird die
                  # Seite nie "idle" und der Goto lief wiederholt in den
                  # 30s-Timeout, obwohl die eigentlichen Daten längst da waren.
                  # domcontentloaded + der explizite Ready-Check unten (auf die
                  # Flugdaten, nicht auf Fotos) reicht und ist robust.
                  page.goto(url, wait_until="domcontentloaded", timeout=30000)

                  # Explizit auf fertig geladene Web-Fonts warten (Work Sans /
                  # Roboto Mono via Google Fonts) -- "networkidle" allein
                  # garantiert nicht, dass der Font-Swap schon passiert ist.
                  try:
                      page.evaluate("document.fonts.ready")
                      page.wait_for_timeout(300)
                  except Exception:
                      pass

                  try:
                      page.wait_for_function(
                          """() => {
                              const el = document.getElementById('aircraftList');
                              return el && !el.textContent.includes('Loading aircraft');
                          }""",
                          timeout=10000,
                      )
                  except Exception:
                      pass

                  # Zusätzlich auf Bilder warten (Tail-Logos in A.L.V.I.N.html,
                  # Fotos in traffic.html/military.html) -- die werden erst NACH
                  # dem obigen Daten-Check per <img src> nachgeladen, waren beim
                  # Screenshot also oft noch leer ("Tails verschwunden" trotz
                  # fertiger Flugliste). img.complete wird laut Spec auch bei
                  # einem Ladefehler (404 o.ä.) true -- blockiert also nicht
                  # dauerhaft, falls eine einzelne Bildquelle mal ausfällt.
                  try:
                      page.wait_for_function(
                          "() => Array.from(document.images).every(img => img.complete)",
                          timeout=4000,
                      )
                  except Exception:
                      pass

                  raw_path = f"raw_{display_id}.png"
                  page.screenshot(path=raw_path)
                  browser.close()

              # Downscale von der 2x-Aufnahme auf die Zielauflösung --
              # LANCZOS mittelt mehrere Quellpixel pro Zielpixel und liefert
              # dadurch echte Zwischen-Grauwerte an Kanten, statt einfach
              # jedes zweite Pixel wegzuwerfen.
              img = Image.open(raw_path).convert("L").resize((WIDTH, HEIGHT), Image.Resampling.LANCZOS)

              # Kontrastverstärkung VOR dem Schwellwert: drückt hellgraue,
              # aber eigentlich sichtbar gemeinte Elemente (dünne Trennlinien,
              # abgeschwächter Text mit CSS opacity, Antialiasing-Kanten)
              # systematisch näher an Schwarz oder Weiß.
              img = ImageEnhance.Contrast(img).enhance(2.5)

              # Harter Schwellwert statt Dithering: hält Text/Linien scharf.
              THRESHOLD = 150
              img = img.point(lambda p: 255 if p > THRESHOLD else 0).convert("1")

              # display1 bleibt aus Kompatibilitätsgründen "screen.bmp"
              # (das bestehende Gerät zeigt schon auf diese URL) -- alle
              # weiteren Displays bekommen ihre eigene Datei nach ihrer ID.
              out_name = "screen.bmp" if display_id == "display1" else f"{display_id}.bmp"
              img.save(out_name)
              print(f"[{display_id}] gespeichert als {out_name}")
              os.remove(raw_path)

          for d in displays:
              # Ein einzelnes fehlerhaftes Display (z.B. ein einmaliger
              # Playwright-Timeout) soll nicht dazu führen, dass alle
              # anderen, funktionierenden Displays diesen Lauf ebenfalls
              # verpassen.
              try:
                  render_display(d["id"])
              except Exception as e:
                  print(f"[{d['id']}] Screenshot fehlgeschlagen, übersprungen: {e}")
          EOF

      - name: Bilder committen (nie amend/force -- das hat wiederholt gemergte PRs zerstört)
        if: steps.check.outputs.sleeping != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.bmp

          if git diff --quiet --cached; then
            echo "Kein Bildupdate, nichts zu committen."
            exit 0
          fi

          git commit -m "Update e-ink screenshot"

          # Nie amend + push --force: das hat wiederholt main zerstört, sobald
          # dieser Lauf mit einem anderen Push (z.B. einem PR-Merge) zeitlich
          # überlappte -- der Amend rewritete den lokal veralteten Tip und
          # der Force-Push riss dabei alles mit, was zwischenzeitlich auf
          # main gelandet war (siehe #6, versehentlich verlorener PR-Merge).
          # Stattdessen: normaler Commit, und bei einem Push-Konflikt (Race
          # mit einem anderen Schreiber) einfach neu rebasen und erneut
          # versuchen -- niemals überschreiben.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push fehlgeschlagen (vermutlich Race mit einem anderen Schreiber), Versuch $i/5 -- rebase und erneut versuchen."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "Push nach 5 Versuchen weiterhin fehlgeschlagen." >&2
          exit 1
