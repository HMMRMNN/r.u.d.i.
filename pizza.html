<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Pizza-Bilanz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ---------------------------------------------------------------
       Design-System wie control.html/iphone.html: klar umrissene
       Panels (dünner Rahmen) statt freier Typografie. Inter +
       JetBrains Mono, streng monochrom, invertiert (schwarzer
       Hintergrund). Gleiche Daten/Fetch-Logik wie bisher, nur
       Layout/Optik neu.
    --------------------------------------------------------------- */
    :root { --black:#ffffff; --white:#000000; --line: rgba(255,255,255,0.28); }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--white); color:var(--black); }
    body {
      display: grid; place-items: center; font-family: "Inter", Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: none; text-rendering: optimizeSpeed;
    }
    .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }

    .frame { position: relative; width: 800px; height: 480px; overflow: hidden; background: var(--white); border: 1px solid var(--black); }
    .canvas { position: absolute; top: 30px; left: 34px; right: 34px; bottom: 40px; display: flex; flex-direction: column; }

    .masthead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
    .mast-left { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5; }
    .mast-right { font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.5; }

    .col-label { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5; margin-bottom: 8px; }

    .panel { border: 1px solid var(--line); padding: 14px 16px; }
    .panel + .panel { margin-top: 14px; }

    .hero { display: flex; align-items: flex-end; gap: 16px; }
    .hero-num { font-size: 96px; font-weight: 200; line-height: 0.82; letter-spacing: -0.04em; }
    .hero-side { padding-bottom: 10px; }
    .hero-label { font-size: 18px; font-weight: 400; }
    .hero-sub { margin-top: 4px; font-size: 12px; opacity: 0.55; }

    .stat-line { margin-top: 10px; font-size: 12px; letter-spacing: 0.02em; opacity: 0.7; }
    .stat-line + .stat-line { margin-top: 4px; opacity: 0.55; }

    .slices { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; }
    .slice { flex: 0 0 auto; color: var(--black); }
    /* Angebissenes Stueck = der Rest, der nicht ganz voll wird.
       Gestrichelte Kontur, damit es sich klar vom vollen Stueck
       unterscheidet -- auf 1-Bit gibt es keine Halbtoene dafuer. */
    .slice.partial path.crustline { stroke-dasharray: 3 2.5; }

    .ride-row { margin-top: auto; display: flex; gap: 14px; }
    .ride-item { flex: 1; border: 1px solid var(--line); padding: 10px 12px; }
    .ride-label { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.5; }
    .ride-value { margin-top: 4px; font-size: 21px; font-weight: 300; letter-spacing: -0.02em; }
    .ride-unit { font-size: 12px; font-weight: 400; opacity: 0.65; }

    .empty { padding-top: 4px; }
    .empty .headline { font-size: 20px; font-weight: 400; }
    .empty .sub { margin-top: 6px; font-size: 12px; opacity: 0.6; }

    .footer {
      position: absolute; left: 34px; right: 34px; bottom: 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      font-size: 8.5px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1; opacity: 0.45;
    }
  </style>
</head>

<body>
  <main class="frame">
    <div class="canvas" id="canvas">
      <div class="masthead">
        <span class="mast-left mono">R.U.D.I. &middot; Pizza-Bilanz</span>
        <span class="mast-right mono" id="mastDate">&ndash;</span>
      </div>
      <div class="empty"><div class="headline">L&auml;dt&hellip;</div></div>
    </div>

    <footer class="footer mono">
      <span id="basis">Nach der letzten Radfahrt</span>
      <span id="updatedAt">Updating</span>
    </footer>
  </main>

  <script>
    "use strict";

    const PIZZA_API = "https://rudi.marvinradar.workers.dev/pizza";
    const REFRESH_INTERVAL_MS = 30 * 60 * 1000;

    const canvas = document.getElementById("canvas");
    const updatedAt = document.getElementById("updatedAt");
    const mastDate = document.getElementById("mastDate");
    const basisEl = document.getElementById("basis");

    // Ein Pizzastueck. Bewusst nur Konturen und Vollflaechen-Details in
    // currentColor -- auf dem invertierten (schwarzen) Hintergrund also
    // weiß statt hartcodiert schwarz. Graustufen wuerden beim 1-Bit-
    // Threshold entweder verschwinden oder zu Flaechen zulaufen.
    function sliceSvg(size, partial) {
      const s = size;
      return `<svg class="slice${partial ? " partial" : ""}" width="${s}" height="${s}" viewBox="0 0 100 100">
        <path d="M50 6 L92 84 Q50 98 8 84 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
        <path class="crustline" d="M12 76 Q50 90 88 76" fill="none" stroke="currentColor" stroke-width="3.5"/>
        <circle cx="40" cy="40" r="6" fill="currentColor"/>
        <circle cx="60" cy="52" r="6" fill="currentColor"/>
        <circle cx="36" cy="60" r="5" fill="currentColor"/>
        <circle cx="58" cy="28" r="4.5" fill="currentColor"/>
      </svg>`;
    }

    function sliceSize(count) {
      if (count <= 3) return 78;
      if (count <= 6) return 64;
      if (count <= 9) return 52;
      if (count <= 12) return 44;
      if (count <= 20) return 36;
      return 28;
    }

    function formatDate(iso) {
      if (!iso) return "";
      const d = new Date(iso + "T12:00:00");
      return d.toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "long", timeZone: "Europe/Berlin" });
    }

    function formatDuration(minutes) {
      if (!minutes) return "–";
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      return h > 0 ? `${h}:${String(m).padStart(2, "0")} h` : `${m} min`;
    }

    async function load() {
      const now = new Date();
      const dayName = now.toLocaleDateString("de-DE", { weekday: "long", timeZone: "Europe/Berlin" }).toUpperCase();
      const fullDate = now.toLocaleDateString("de-DE", { day: "2-digit", month: "long", year: "numeric", timeZone: "Europe/Berlin" });
      mastDate.textContent = `${dayName} · ${fullDate}`;

      try {
        const res = await fetch(PIZZA_API, { headers: { Accept: "application/json" }, cache: "no-store" });
        const data = await res.json();

        if (!res.ok || !data.kcal) {
          renderEmpty(data);
        } else {
          render(data);
        }

        updatedAt.textContent = `Updated ${now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" })}`;
      } catch (error) {
        console.error(error);
        renderEmpty({ reason: "Verbindung fehlgeschlagen" });
        updatedAt.textContent = "Update failed";
      }
    }

    function renderEmpty(data) {
      canvas.innerHTML = `
        <div class="masthead">
          <span class="mast-left mono">R.U.D.I. &middot; Pizza-Bilanz</span>
          <span class="mast-right mono">${mastDate.textContent}</span>
        </div>
        <div class="empty">
          <div class="headline">Noch keine Fahrt erfasst</div>
          <div class="sub mono">${data.reason || "Nach der nächsten Radfahrt geht es hier weiter"}</div>
        </div>`;
    }

    function render(data) {
      const slices = data.slices || 0;
      // Rest, der kein volles Stueck mehr ergibt -- wird als
      // angebissenes Stueck dargestellt, sofern nennenswert.
      const restKcal = (data.kcal || 0) - slices * (data.kcalProStueck || 285);
      const showPartial = restKcal >= (data.kcalProStueck || 285) * 0.35;

      const total = slices + (showPartial ? 1 : 0);
      const size = sliceSize(total);

      let svgs = "";
      for (let i = 0; i < slices; i++) svgs += sliceSvg(size, false);
      if (showPartial) svgs += sliceSvg(size, true);

      basisEl.textContent = `1 Stück = ${data.kcalProStueck || 285} kcal`;

      canvas.innerHTML = `
        <div class="masthead">
          <span class="mast-left mono">R.U.D.I. &middot; Pizza-Bilanz</span>
          <span class="mast-right mono">${mastDate.textContent}</span>
        </div>

        <div class="panel">
          <div class="hero">
            <div class="hero-num">${slices}</div>
            <div class="hero-side">
              <div class="hero-label">St&uuml;ck Pizza verdient</div>
              <div class="hero-sub mono">${showPartial ? "+ 1 angebissenes" : "glatt aufgegangen"}</div>
            </div>
          </div>
          <div class="stat-line mono">${data.kcal.toLocaleString("de-DE")} kcal verbrannt &middot; ${formatDate(data.date)}</div>

          <div class="slices">${svgs || '<div class="hero-sub mono">Nicht genug f&uuml;r ein ganzes St&uuml;ck</div>'}</div>
        </div>

        <div class="ride-row">
          <div class="ride-item">
            <div class="ride-label">Distanz</div>
            <div class="ride-value">${data.km}<span class="ride-unit"> km</span></div>
          </div>
          <div class="ride-item">
            <div class="ride-label">H&ouml;henmeter</div>
            <div class="ride-value">${data.elevation}<span class="ride-unit"> hm</span></div>
          </div>
          <div class="ride-item">
            <div class="ride-label">Dauer</div>
            <div class="ride-value">${formatDuration(data.minutes)}</div>
          </div>
          <div class="ride-item">
            <div class="ride-label">Verbrauch</div>
            <div class="ride-value">${data.kcal}<span class="ride-unit"> kcal</span></div>
          </div>
        </div>
      `;
    }

    load();
    setInterval(load, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
