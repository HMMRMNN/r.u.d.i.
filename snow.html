<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Schneebericht</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700;800&family=Roboto+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root { --black:#000000; --white:#ffffff; }
    * { box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: var(--white); color: var(--black);
    }

    body {
      display: grid; place-items: center; font-family: "Work Sans", Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: none;
      text-rendering: optimizeSpeed;
    }

    .frame {
      position: relative; width: 800px; height: 480px;
      overflow: hidden; background: var(--white);
      border: 1px solid var(--black);
    }

    .header {
      position: absolute; top: 14px; left: 20px; right: 20px;
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 18px; padding-bottom: 8px; border-bottom: 1px solid var(--black);
    }

    .brand { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.22em; }
    .subtitle {
      margin: 4px 0 0; font-size: 11px; line-height: 1.1;
      font-family: "Roboto Mono", ui-monospace, Menlo, monospace;
    }
    .date-badge {
      text-align: right; font-family: "Roboto Mono", ui-monospace, Menlo, monospace;
    }
    .date-badge .day { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; }
    .date-badge .full { font-size: 10px; }

    .main {
      position: absolute; top: 58px; left: 20px; right: 20px; bottom: 34px;
      display: grid; grid-template-columns: 240px 1fr; gap: 0;
    }

    .overview { padding-right: 16px; border-right: 1px solid var(--black); }

    .snow-row { display: flex; gap: 14px; }
    .snow-col { flex: 1 1 0; }
    .snow-big { font-size: 34px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; }
    .snow-unit { font-size: 14px; font-weight: 700; }
    .snow-lbl {
      font-size: 8px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.6;
    }

    .mini-stats { margin-top: 12px; display: grid; gap: 6px; }
    .mini-stat {
      display: flex; justify-content: space-between; gap: 8px;
      font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 10.5px;
      padding-bottom: 5px; border-bottom: 1px solid #000;
    }
    .mini-stat span:first-child { opacity: 0.7; }
    .mini-stat span:last-child { font-weight: 700; }

    .info-box {
      margin-top: 8px; padding: 7px 9px; border: 1.5px solid var(--black);
    }
    .info-box.foehn { border-style: dashed; }
    .info-box.avalanche { border-style: solid; border-width: 2px; }
    .info-box .label {
      font-size: 7.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    }
    .info-box .value { margin-top: 2px; font-size: 14px; font-weight: 800; }
    .info-box .hint { margin-top: 2px; font-size: 8.5px; opacity: 0.75; }

    .resorts { padding-left: 18px; display: flex; flex-direction: column; }

    .resorts-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 6px;
    }
    .resorts-head h2 {
      margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .rating {
      font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 700;
      padding: 2px 8px; border: 1.5px solid var(--black);
    }

    .resort-table { width: 100%; border-collapse: collapse; font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 10px; }
    .resort-table th, .resort-table td { text-align: left; padding: 4px 5px 5px 0; border-bottom: 1px solid #000; }
    .resort-table th { font-size: 8px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.65; border-bottom: 1.5px solid var(--black); }

    .sun-row {
      margin-top: 10px; display: flex; gap: 16px;
      font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 10px;
    }
    .sun-row .item span { display: block; font-size: 7.5px; opacity: 0.6; text-transform: uppercase; }

    .disclaimer {
      margin-top: auto; padding-top: 6px; border-top: 1px solid #000;
      font-size: 9.5px; line-height: 1.35;
    }

    .footer {
      position: absolute; left: 20px; right: 20px; bottom: 10px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding-top: 7px; border-top: 1px solid var(--black);
      font-family: "Roboto Mono", ui-monospace, Menlo, monospace;
      font-size: 8px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1;
    }

    .empty {
      position: absolute; inset: 58px 20px 34px; display: grid; place-items: center;
      font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 13px; text-align: center;
    }
  </style>
</head>

<body>
  <main class="frame">
    <header class="header">
      <div>
        <p class="brand">SCHNEEBERICHT</p>
        <p class="subtitle">Chiemgauer Skigebiete &amp; Tourenplanung</p>
      </div>
      <div class="date-badge">
        <div class="day" id="dayName">&ndash;</div>
        <div class="full" id="fullDate">&ndash;</div>
      </div>
    </header>

    <section class="main" id="main">
      <div class="empty">Loading&hellip;</div>
    </section>

    <footer class="footer">
      <span>Grassau, Germany</span>
      <span id="updatedAt">Updating</span>
    </footer>
  </main>

  <script>
    "use strict";

    const WEATHER_API = "https://api.open-meteo.com/v1/forecast";
    const REFRESH_INTERVAL_MS = 30 * 60 * 1000;

    // TODO: Sobald die exakte CAAML-XML-Feed-URL vom Lawinenwarndienst
    // Bayern (Region "Chiemgauer Alpen") bekannt ist, wird hier ein
    // Worker-Endpunkt (rudi-worker.js) angebunden, der die Gefahrenstufe
    // liefert. Bis dahin zeigt die Box unten einen Platzhalter.
    const AVALANCHE_API = "https://rudi.marvinradar.workers.dev/avalanche";

    const VALLEY = { name: "Grassau (Tal)", lat: 47.7756, lon: 12.4550, elevation: 540 };

    // Ungefähre Gipfel-/Bergstationskoordinaten -- keine exakten
    // Vermessungsdaten, aber nah genug für eine Modellschätzung.
    //
    // avalancheRegion: "west" = verifiziert (Achental, eindeutig Richtung
    // Inntal). "unklar" = geografisch plausibel Ost, aber OHNE
    // verifizierte Grenzkarte zwischen den LWD-Bayern-Teilregionen --
    // die Lawinenwarnstufen-Box oben zeigt NUR West, gilt für diese
    // beiden explizit NICHT.
    const RESORTS = [
      { name: "Hochfelln", town: "Bergen", lat: 47.7631, lon: 12.5606, elevation: 1674, avalancheRegion: "west" },
      { name: "Kampenwand", town: "Aschau", lat: 47.7461, lon: 12.3567, elevation: 1669, avalancheRegion: "west" },
      { name: "Winklmoos-Steinplatte", town: "Reit i. Winkl", lat: 47.6690, lon: 12.4870, elevation: 1800, avalancheRegion: "unklar" },
      { name: "Unternberg", town: "Ruhpolding", lat: 47.7333, lon: 12.6333, elevation: 1450, avalancheRegion: "unklar" },
    ];

    const ALL_LOCATIONS = [VALLEY, ...RESORTS];

    const mainEl = document.getElementById("main");
    const updatedAt = document.getElementById("updatedAt");
    const dayName = document.getElementById("dayName");
    const fullDate = document.getElementById("fullDate");

    async function loadSnow() {
      try {
        const lats = ALL_LOCATIONS.map((r) => r.lat).join(",");
        const lons = ALL_LOCATIONS.map((r) => r.lon).join(",");

        const params = new URLSearchParams({
          latitude: lats,
          longitude: lons,
          hourly: ["snow_depth", "snowfall", "temperature_2m", "freezinglevel_height", "windspeed_10m", "winddirection_10m"].join(","),
          daily: ["temperature_2m_max", "temperature_2m_min", "snowfall_sum", "sunrise", "sunset"].join(","),
          timezone: "Europe/Berlin",
        });

        const requests = [
          fetch(`${WEATHER_API}?${params.toString()}`, {
            headers: { Accept: "application/json" }, cache: "no-store",
          }),
        ];
        if (AVALANCHE_API) {
          requests.push(fetch(AVALANCHE_API, { headers: { Accept: "application/json" }, cache: "no-store" }).catch(() => null));
        }

        const [response, avalancheResponse] = await Promise.all(requests);

        if (!response.ok) throw new Error(`Weather HTTP ${response.status}`);

        const dataArray = await response.json();
        const data = Array.isArray(dataArray) ? dataArray : [dataArray];
        const avalancheData = avalancheResponse && avalancheResponse.ok ? await avalancheResponse.json() : null;

        render(data, avalancheData);

        updatedAt.textContent =
          `Updated ${new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })}`;
      } catch (error) {
        console.error(error);
        mainEl.innerHTML = '<div class="empty">Schneedaten nicht verfügbar.</div>';
        updatedAt.textContent = "Update failed";
      }
    }

    function extractPoint(d) {
      const hourly = d.hourly;
      const nowIso = new Date().toISOString().slice(0, 13);
      let idx = hourly.time.findIndex((t) => t.startsWith(nowIso));
      if (idx < 0) idx = 12;
      return {
        snowDepthCm: Math.round((hourly.snow_depth[idx] || 0) * 100),
        newSnow24hCm: Math.round(d.daily.snowfall_sum[0] || 0),
        freezingLevel: Math.round(hourly.freezinglevel_height[idx] || 0),
        wind: Math.round(hourly.windspeed_10m[idx] || 0),
        windDir: Math.round(hourly.winddirection_10m[idx] || 0),
        temp: Math.round(hourly.temperature_2m[idx]),
      };
    }

    function windDirLabel(deg) {
      const dirs = ["N", "NO", "O", "SO", "S", "SW", "W", "NW"];
      return dirs[Math.round(deg / 45) % 8];
    }

    function render(dataArray, avalancheData) {
      const now = new Date();
      dayName.textContent = now.toLocaleDateString("de-DE", { weekday: "long" }).toUpperCase();
      fullDate.textContent = now.toLocaleDateString("de-DE", { day: "2-digit", month: "long", year: "numeric" });

      const valleyData = extractPoint(dataArray[0]);
      const resortData = RESORTS.map((resort, i) => ({
        ...resort,
        ...extractPoint(dataArray[i + 1]),
      }));

      const mainResort = resortData[0]; // Hochfelln, nächstgelegen
      const avgSnow = resortData.reduce((s, r) => s + r.snowDepthCm, 0) / resortData.length;
      const rating = avgSnow >= 40 ? "GUT" : avgSnow >= 15 ? "MÄSSIG" : "SCHLECHT";

      const freezingBelowAllResorts = resortData.every((r) => r.freezingLevel < r.elevation - 100);
      const foehnLabel = !freezingBelowAllResorts ? "NICHT AUSZUSCHLIESSEN" : "KEIN HINWEIS";
      const foehnHint = !freezingBelowAllResorts
        ? "Frostgrenze nahe/&uuml;ber Gipfelh&ouml;he (Modellwert)"
        : "Frostgrenze deutlich unter Gipfelh&ouml;he (Modellwert)";

      const avalancheLabel = avalancheData?.available && avalancheData?.dangerLevel
        ? `STUFE ${avalancheData.dangerLevel}`
        : avalancheData?.reason?.includes("Saison")
          ? "SAISON BEENDET"
          : "SIEHE LWD BAYERN";
      const avalancheHint = avalancheData?.available
        ? "Gilt nur f&uuml;r Hochfelln/Kampenwand (Region West, verifiziert)"
        : "lawinenwarndienst.bayern.de";

      const sunrise = new Date(dataArray[0].daily.sunrise[0]).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
      const sunset = new Date(dataArray[0].daily.sunset[0]).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });

      const rows = resortData.map((r) => `
        <tr>
          <td>${r.name}${r.avalancheRegion === "unklar" ? " *" : ""}</td>
          <td>${r.elevation} m</td>
          <td>${r.snowDepthCm} cm</td>
          <td>+${r.newSnow24hCm} cm</td>
          <td>${r.wind} km/h ${windDirLabel(r.windDir)}</td>
        </tr>
      `).join("");

      mainEl.innerHTML = `
        <div class="overview">
          <div class="snow-row">
            <div class="snow-col">
              <div class="snow-lbl">Tal (${VALLEY.elevation}m)</div>
              <div class="snow-big">${valleyData.snowDepthCm}<span class="snow-unit">cm</span></div>
            </div>
            <div class="snow-col">
              <div class="snow-lbl">Berg (${mainResort.elevation}m)</div>
              <div class="snow-big">${mainResort.snowDepthCm}<span class="snow-unit">cm</span></div>
            </div>
          </div>

          <div class="mini-stats">
            <div class="mini-stat"><span>Neuschnee Berg 24h</span><span>+${mainResort.newSnow24hCm} cm</span></div>
            <div class="mini-stat"><span>Temp Tal / Berg</span><span>${valleyData.temp}&deg; / ${mainResort.temp}&deg;C</span></div>
            <div class="mini-stat"><span>Frostgrenze</span><span>${mainResort.freezingLevel} m</span></div>
            <div class="mini-stat"><span>Wind Berg</span><span>${mainResort.wind} km/h ${windDirLabel(mainResort.windDir)}</span></div>
          </div>

          <div class="info-box avalanche">
            <div class="label">Lawinenwarnstufe (Chiemgau West)</div>
            <div class="value">${avalancheLabel}</div>
            <div class="hint">${avalancheHint}</div>
          </div>

          <div class="info-box foehn">
            <div class="label">F&ouml;hn / Nassschnee</div>
            <div class="value">${foehnLabel}</div>
            <div class="hint">${foehnHint}</div>
          </div>

          <div class="sun-row">
            <div class="item"><span>Aufgang</span>${sunrise}</div>
            <div class="item"><span>Untergang</span>${sunset}</div>
          </div>
        </div>

        <div class="resorts">
          <div class="resorts-head">
            <h2>Skigebiete Chiemgau</h2>
            <span class="rating">${rating}</span>
          </div>

          <table class="resort-table">
            <thead>
              <tr><th>Gebiet</th><th>Gipfel</th><th>Schnee</th><th>Neu</th><th>Wind</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>

          <p class="disclaimer">
            <strong>* Winklmoos-Steinplatte &amp; Unternberg: Zuordnung zur
            Lawinenregion (West/Ost) nicht verifiziert &ndash; die
            Warnstufe oben gilt nachweislich NICHT f&uuml;r diese beiden
            Gebiete.</strong> Vor jeder Tour dort separat den vollst&auml;ndigen
            Lagebericht auf lawinenwarndienst.bayern.de pr&uuml;fen.
            Schneeh&ouml;he, Wind &amp; Neuschnee: Wettermodell-Sch&auml;tzung
            (Open-Meteo) an gesch&auml;tzten Gipfelkoordinaten &ndash;
            <strong>keine offizielle Pistenmeldung</strong>. Ersetzt nie
            die eigenst&auml;ndige Tourenplanung und den vollst&auml;ndigen
            Lawinenlagebericht.
          </p>
        </div>
      `;
    }

    loadSnow();
    setInterval(loadSnow, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
