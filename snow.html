<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Schneebericht</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ---------------------------------------------------------------
       Gleiches Design-System wie weather.html (v2): keine Boxen/Rahmen
       um Inhalte -- Struktur entsteht durch Typografie-Hierarchie und
       Weißraum, nur die äußere Frame-Kontur bleibt als durchgezogene
       Linie. Streng monochrom, invertiert (schwarzer Hintergrund).
       Gleiche Daten/Fetch-Logik wie bisher, nur Layout/Optik neu.
    --------------------------------------------------------------- */
    :root { --black:#ffffff; --white:#000000; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--white); color:var(--black); }
    body {
      display: grid; place-items: center; font-family: "Inter", Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: none; text-rendering: optimizeSpeed;
    }
    .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }

    .frame { position: relative; width: 800px; height: 480px; overflow: hidden; background: var(--white); border: 1px solid var(--black); }
    .canvas { position: absolute; top: 30px; left: 34px; right: 34px; bottom: 40px; display: flex; flex-direction: column; }

    .masthead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; }
    .mast-left { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5; }
    .mast-right { font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.5; }

    .col-label { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5; margin-bottom: 6px; }
    .stat-line { margin-top: 8px; font-size: 12px; letter-spacing: 0.02em; opacity: 0.7; }
    .stat-line + .stat-line { margin-top: 4px; opacity: 0.55; }

    .split { display: flex; gap: 44px; flex: 1; min-height: 0; }
    .split-col.narrow { flex: 0 0 230px; display: flex; flex-direction: column; }
    .split-col.wide { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    .dual-hero { display: flex; gap: 28px; }
    .dual-hero-item { flex: 1; }
    .dual-hero-value { font-size: 44px; font-weight: 200; line-height: 0.9; letter-spacing: -0.03em; }
    .dual-hero-unit { font-size: 15px; font-weight: 300; opacity: 0.7; }

    .info-block { margin-top: 12px; }
    .info-value { font-size: 15px; font-weight: 600; margin-top: 2px; }
    .info-hint { margin-top: 2px; font-size: 10px; opacity: 0.55; }

    .sun-line { margin-top: 12px; font-size: 12px; opacity: 0.65; }

    .resorts-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
    .rating-line { font-size: 12px; }

    .resort-list { display: flex; flex-direction: column; gap: 10px; }
    .resort-row { display: flex; align-items: baseline; gap: 16px; font-size: 14px; }
    .resort-name { flex: 1; }
    .resort-stat { font-size: 11px; opacity: 0.65; width: 84px; text-align: right; flex-shrink: 0; }

    .disclaimer { margin-top: auto; padding-top: 14px; font-size: 9.5px; line-height: 1.5; opacity: 0.5; }
    .disclaimer strong { opacity: 1; font-weight: 600; }

    .footer {
      position: absolute; left: 34px; right: 34px; bottom: 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      font-size: 8.5px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1; opacity: 0.45;
    }
    .empty { font-size: 13px; opacity: 0.6; }
  </style>
</head>

<body>
  <main class="frame">
    <div class="canvas" id="canvas">
      <div class="empty mono">Loading&hellip;</div>
    </div>
    <footer class="footer mono">
      <span>Grassau, Germany</span>
      <span id="updatedAt">Updating</span>
    </footer>
  </main>

  <script>
    "use strict";

    const WEATHER_API = "https://api.open-meteo.com/v1/forecast";
    const REFRESH_INTERVAL_MS = 30 * 60 * 1000;

    // TODO: Sobald die exakte CAAML-XML-Feed-URL vom Lawinenwarndienst
    // Bayern (Region "Chiemgauer Alpen") bekannt ist, wird hier ein
    // Worker-Endpunkt (rudi-worker.js) angebunden, der die Gefahrenstufe
    // liefert. Bis dahin zeigt die Box unten einen Platzhalter.
    const AVALANCHE_API = "https://rudi.marvinradar.workers.dev/avalanche";

    const VALLEY = { name: "Grassau (Tal)", lat: 47.7756, lon: 12.4550, elevation: 540 };

    // Ungefähre Gipfel-/Bergstationskoordinaten -- keine exakten
    // Vermessungsdaten, aber nah genug für eine Modellschätzung.
    //
    // avalancheRegion: "west" = verifiziert (Achental, eindeutig Richtung
    // Inntal). "unklar" = geografisch plausibel Ost, aber OHNE
    // verifizierte Grenzkarte zwischen den LWD-Bayern-Teilregionen --
    // die Lawinenwarnstufen-Box oben zeigt NUR West, gilt für diese
    // beiden explizit NICHT.
    const RESORTS = [
      { name: "Hochfelln", town: "Bergen", lat: 47.7631, lon: 12.5606, elevation: 1674, avalancheRegion: "west" },
      { name: "Kampenwand", town: "Aschau", lat: 47.7461, lon: 12.3567, elevation: 1669, avalancheRegion: "west" },
      { name: "Winklmoos-Steinplatte", town: "Reit i. Winkl", lat: 47.6690, lon: 12.4870, elevation: 1800, avalancheRegion: "unklar" },
      { name: "Unternberg", town: "Ruhpolding", lat: 47.7333, lon: 12.6333, elevation: 1450, avalancheRegion: "unklar" },
    ];

    const ALL_LOCATIONS = [VALLEY, ...RESORTS];

    const canvas = document.getElementById("canvas");
    const updatedAt = document.getElementById("updatedAt");

    async function loadSnow() {
      try {
        const lats = ALL_LOCATIONS.map((r) => r.lat).join(",");
        const lons = ALL_LOCATIONS.map((r) => r.lon).join(",");

        const params = new URLSearchParams({
          latitude: lats,
          longitude: lons,
          hourly: ["snow_depth", "snowfall", "temperature_2m", "freezinglevel_height", "windspeed_10m", "winddirection_10m"].join(","),
          daily: ["temperature_2m_max", "temperature_2m_min", "snowfall_sum", "sunrise", "sunset"].join(","),
          timezone: "Europe/Berlin",
        });

        const requests = [
          fetch(`${WEATHER_API}?${params.toString()}`, {
            headers: { Accept: "application/json" }, cache: "no-store",
          }),
        ];
        if (AVALANCHE_API) {
          requests.push(fetch(AVALANCHE_API, { headers: { Accept: "application/json" }, cache: "no-store" }).catch(() => null));
        }

        const [response, avalancheResponse] = await Promise.all(requests);

        if (!response.ok) throw new Error(`Weather HTTP ${response.status}`);

        const dataArray = await response.json();
        const data = Array.isArray(dataArray) ? dataArray : [dataArray];
        const avalancheData = avalancheResponse && avalancheResponse.ok ? await avalancheResponse.json() : null;

        render(data, avalancheData);

        updatedAt.textContent =
          `Updated ${new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })}`;
      } catch (error) {
        console.error(error);
        canvas.innerHTML = '<div class="empty mono">Schneedaten nicht verf&uuml;gbar.</div>';
        updatedAt.textContent = "Update failed";
      }
    }

    function extractPoint(d) {
      const hourly = d.hourly;
      const nowIso = new Date().toISOString().slice(0, 13);
      let idx = hourly.time.findIndex((t) => t.startsWith(nowIso));
      if (idx < 0) idx = 12;
      return {
        snowDepthCm: Math.round((hourly.snow_depth[idx] || 0) * 100),
        newSnow24hCm: Math.round(d.daily.snowfall_sum[0] || 0),
        freezingLevel: Math.round(hourly.freezinglevel_height[idx] || 0),
        wind: Math.round(hourly.windspeed_10m[idx] || 0),
        windDir: Math.round(hourly.winddirection_10m[idx] || 0),
        temp: Math.round(hourly.temperature_2m[idx]),
      };
    }

    function windDirLabel(deg) {
      const dirs = ["N", "NO", "O", "SO", "S", "SW", "W", "NW"];
      return dirs[Math.round(deg / 45) % 8];
    }

    function ratingDot(rating) {
      if (rating === "GUT") return "●";
      if (rating === "MÄSSIG") return "◐";
      return "○";
    }

    function render(dataArray, avalancheData) {
      const now = new Date();
      const dayName = now.toLocaleDateString("de-DE", { weekday: "long" }).toUpperCase();
      const fullDate = now.toLocaleDateString("de-DE", { day: "2-digit", month: "long", year: "numeric" });

      const valleyData = extractPoint(dataArray[0]);
      const resortData = RESORTS.map((resort, i) => ({
        ...resort,
        ...extractPoint(dataArray[i + 1]),
      }));

      const mainResort = resortData[0]; // Hochfelln, nächstgelegen
      const avgSnow = resortData.reduce((s, r) => s + r.snowDepthCm, 0) / resortData.length;
      const rating = avgSnow >= 40 ? "GUT" : avgSnow >= 15 ? "MÄSSIG" : "SCHLECHT";

      const freezingBelowAllResorts = resortData.every((r) => r.freezingLevel < r.elevation - 100);
      const foehnLabel = !freezingBelowAllResorts ? "NICHT AUSZUSCHLIESSEN" : "KEIN HINWEIS";
      const foehnHint = !freezingBelowAllResorts
        ? "Frostgrenze nahe/&uuml;ber Gipfelh&ouml;he (Modellwert)"
        : "Frostgrenze deutlich unter Gipfelh&ouml;he (Modellwert)";

      const avalancheLabel = avalancheData?.available && avalancheData?.dangerLevel
        ? `STUFE ${avalancheData.dangerLevel}`
        : avalancheData?.reason?.includes("Saison")
          ? "SAISON BEENDET"
          : "SIEHE LWD BAYERN";
      const avalancheHint = avalancheData?.available
        ? "Gilt nur f&uuml;r Hochfelln/Kampenwand (Region West, verifiziert)"
        : "lawinenwarndienst.bayern.de";

      const sunrise = new Date(dataArray[0].daily.sunrise[0]).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
      const sunset = new Date(dataArray[0].daily.sunset[0]).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });

      const rows = resortData.map((r) => `
        <div class="resort-row">
          <span class="resort-name">${r.name}${r.avalancheRegion === "unklar" ? " *" : ""}</span>
          <span class="resort-stat mono">${r.elevation} m</span>
          <span class="resort-stat mono">${r.snowDepthCm} cm</span>
          <span class="resort-stat mono">+${r.newSnow24hCm} cm</span>
          <span class="resort-stat mono">${r.wind} km/h ${windDirLabel(r.windDir)}</span>
        </div>
      `).join("");

      canvas.innerHTML = `
        <div class="masthead">
          <span class="mast-left mono">R.U.D.I. &middot; Schneebericht</span>
          <span class="mast-right mono">${dayName} &middot; ${fullDate}</span>
        </div>

        <div class="split">
          <div class="split-col narrow">
            <div class="dual-hero">
              <div class="dual-hero-item">
                <p class="col-label">Tal (${VALLEY.elevation}m)</p>
                <div class="dual-hero-value">${valleyData.snowDepthCm}<span class="dual-hero-unit">cm</span></div>
              </div>
              <div class="dual-hero-item">
                <p class="col-label">Berg (${mainResort.elevation}m)</p>
                <div class="dual-hero-value">${mainResort.snowDepthCm}<span class="dual-hero-unit">cm</span></div>
              </div>
            </div>

            <p class="stat-line mono">Neuschnee Berg 24h +${mainResort.newSnow24hCm} cm &middot; Temp Tal/Berg ${valleyData.temp}&deg;/${mainResort.temp}&deg;C</p>
            <p class="stat-line mono">Frostgrenze ${mainResort.freezingLevel} m &middot; Wind Berg ${mainResort.wind} km/h ${windDirLabel(mainResort.windDir)}</p>

            <div class="info-block">
              <p class="col-label">Lawinenwarnstufe (Chiemgau West)</p>
              <p class="info-value">${avalancheLabel}</p>
              <p class="info-hint">${avalancheHint}</p>
            </div>

            <div class="info-block">
              <p class="col-label">F&ouml;hn / Nassschnee</p>
              <p class="info-value">${foehnLabel}</p>
              <p class="info-hint">${foehnHint}</p>
            </div>

            <p class="sun-line mono">Sonne ${sunrise}&ndash;${sunset}</p>
          </div>

          <div class="split-col wide">
            <div class="resorts-head">
              <p class="col-label" style="margin:0;">Skigebiete Chiemgau</p>
              <span class="rating-line mono">${ratingDot(rating)} ${rating}</span>
            </div>

            <div class="resort-list">${rows}</div>

            <p class="disclaimer">
              <strong>* Winklmoos-Steinplatte &amp; Unternberg: Zuordnung zur
              Lawinenregion (West/Ost) nicht verifiziert &ndash; die
              Warnstufe oben gilt nachweislich NICHT f&uuml;r diese beiden
              Gebiete.</strong> Vor jeder Tour dort separat den vollst&auml;ndigen
              Lagebericht auf lawinenwarndienst.bayern.de pr&uuml;fen.
              Schneeh&ouml;he, Wind &amp; Neuschnee: Wettermodell-Sch&auml;tzung
              (Open-Meteo) an gesch&auml;tzten Gipfelkoordinaten &ndash;
              <strong>keine offizielle Pistenmeldung</strong>. Ersetzt nie
              die eigenst&auml;ndige Tourenplanung und den vollst&auml;ndigen
              Lawinenlagebericht.
            </p>
          </div>
        </div>
      `;
    }

    loadSnow();
    setInterval(loadSnow, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
