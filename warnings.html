<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Wetterwarnung</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
  rel="stylesheet"
/>

<style>
  /* ---------------------------------------------------------------
     Design-System wie control.html/iphone.html: klar umrissene
     Panels (dünner Rahmen) statt freier Typografie -- jede Warnung
     bekommt eine eigene Box, Dringlichkeit über Rahmenbreite/-helligkeit
     statt nur Schriftgewicht. Inter + JetBrains Mono, streng
     monochrom, invertiert (schwarzer Hintergrund). Gleiche
     Daten/Fetch-Logik wie bisher, nur Layout/Optik neu.
  --------------------------------------------------------------- */
  :root { --black:#ffffff; --white:#000000; --line: var(--black); }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--white); color:var(--black); }
  body {
    display: grid; place-items: center; font-family: "Inter", Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: none; text-rendering: optimizeSpeed;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }

  .frame { position: relative; width: 800px; height: 480px; overflow: hidden; background: var(--white); border: 1px solid var(--black); }
  .canvas { position: absolute; top: 30px; left: 34px; right: 34px; bottom: 40px; display: flex; flex-direction: column; }

  .masthead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .mast-left { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5; }
  .mast-right { font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.5; }
  .status-line { font-size: 12px; opacity: 0.6; margin-bottom: 20px; }

  .panel { border: 1px solid var(--line); padding: 12px 14px; }

  .calm-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
  .calm-text { font-size: 26px; font-weight: 300; }
  .calm-sub { font-size: 12px; opacity: 0.55; }

  .warnings-list { display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
  .warning-entry { border: 1px solid var(--black); padding: 12px 14px; }
  .warning-entry.level-3, .warning-entry.level-4 { border-width: 2px; }
  .warning-top-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .warning-event { font-size: 18px; font-weight: 500; margin: 0; }
  .warning-level { font-size: 10.5px; letter-spacing: 0.06em; opacity: 0.6; white-space: nowrap; flex-shrink: 0; }
  .warning-headline { margin: 5px 0 0; font-size: 12.5px; opacity: 0.75; line-height: 1.35; }
  .warning-time { margin: 6px 0 0; font-size: 10px; opacity: 0.5; }

  .empty { font-size: 13px; opacity: 0.6; }

  .footer {
    position: absolute; left: 34px; right: 34px; bottom: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    font-size: 8.5px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1; opacity: 0.45;
  }
</style>
</head>
<body>
  <main class="frame">
    <div class="canvas">
      <div class="masthead">
        <span class="mast-left mono">R.U.D.I. &middot; Wetterwarnung</span>
        <span class="mast-right mono" id="mastDate">&ndash;</span>
      </div>
      <p class="status-line mono">Landkreis Traunstein</p>

      <div id="content" style="flex:1; display:flex; flex-direction:column; min-height:0;">
        <div class="empty mono">Loading&hellip;</div>
      </div>
    </div>

    <footer class="footer mono">
      <span id="footerNote">Loading&hellip;</span>
      <span id="updatedAt">Updating</span>
    </footer>
  </main>

  <script>
    "use strict";

    const RUDI_WORKER = "https://rudi.marvinradar.workers.dev";
    const REFRESH_INTERVAL_MS = 900000; // 15 Min -- DWD aktualisiert laut eigener Doku alle 30 Min

    const contentEl = document.getElementById("content");
    const footerNote = document.getElementById("footerNote");
    const updatedAt = document.getElementById("updatedAt");
    const mastDate = document.getElementById("mastDate");

    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // DWD nutzt CAP-Standardwerte (Minor/Moderate/Severe/Extreme) --
    // hier auf die in Deutschland gebräuchlichen Warnstufen 1-4
    // gemappt, für unmittelbares Verständnis ohne Nachschlagen.
    const SEVERITY_MAP = {
      Minor: { level: 1, label: "Stufe 1 · Wetterwarnung" },
      Moderate: { level: 2, label: "Stufe 2 · Markante Wetterwarnung" },
      Severe: { level: 3, label: "Stufe 3 · Unwetterwarnung" },
      Extreme: { level: 4, label: "Stufe 4 · Extreme Unwetterwarnung" },
    };

    function formatTimeRange(onsetMs, expiresMs) {
      const opts = { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" };
      const onset = onsetMs ? new Date(Number(onsetMs)).toLocaleString("de-DE", opts) : "?";
      const expires = expiresMs ? new Date(Number(expiresMs)).toLocaleString("de-DE", opts) : "?";
      return `${onset} bis ${expires} Uhr`;
    }

    function renderCalm() {
      contentEl.innerHTML = `
        <div class="calm-state">
          <p class="calm-text">Keine Warnungen</p>
          <p class="calm-sub mono">Landkreis Traunstein &middot; Stand siehe unten</p>
        </div>
      `;
    }

    function renderWarnings(warnings) {
      contentEl.innerHTML = `
        <div class="warnings-list">
          ${warnings.map((w) => {
            const sev = SEVERITY_MAP[w.severity] || { level: 0, label: w.severity || "Unbekannt" };
            return `
              <div class="warning-entry level-${sev.level}">
                <div class="warning-top-row">
                  <p class="warning-event" style="font-weight:${400 + sev.level * 75};">${escapeHtml(w.event || "Warnung")}</p>
                  <span class="warning-level mono">${escapeHtml(sev.label)}</span>
                </div>
                <p class="warning-headline">${escapeHtml(w.headline || "")}</p>
                <p class="warning-time mono">${formatTimeRange(w.onset, w.expires)}</p>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    async function loadDisplay() {
      const now = new Date();
      const dayName = now.toLocaleDateString("de-DE", { weekday: "long", timeZone: "Europe/Berlin" }).toUpperCase();
      const fullDate = now.toLocaleDateString("de-DE", { day: "2-digit", month: "long", year: "numeric", timeZone: "Europe/Berlin" });
      mastDate.textContent = `${dayName} · ${fullDate}`;

      try {
        const response = await fetch(`${RUDI_WORKER}/warnings/traunstein`, {
          headers: { Accept: "application/json" }, cache: "no-store",
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        if (!data.warnings || data.warnings.length === 0) {
          renderCalm();
        } else {
          renderWarnings(data.warnings);
        }
        footerNote.textContent = `Quelle: DWD · ${data.count ?? 0} aktive Warnung(en)`;
      } catch (error) {
        console.error(error);
        contentEl.innerHTML = `<div class="empty mono">Warnungen gerade nicht verfügbar.</div>`;
        footerNote.textContent = "Update failed";
      }
      updatedAt.textContent = now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" });
    }

    loadDisplay();
    setInterval(loadDisplay, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
