<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Wetterwarnung</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700;800&family=Roboto+Mono:wght@400;500;700&display=swap"
  rel="stylesheet"
/>

<style>
  :root { --black: #fff; --white: #000; }
  * { box-sizing: border-box; -webkit-font-smoothing: none; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--white); color: var(--black); font-family: "Work Sans", Arial, Helvetica, sans-serif; }
  .frame { position: relative; width: 800px; height: 480px; overflow: hidden; background: var(--white); border: 1px solid var(--black); }
  .header {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 14px 20px 8px; border-bottom: 1px solid var(--black);
  }
  .brand { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.22em; }
  .subtitle { margin: 4px 0 0; font-size: 11px; line-height: 1.1; font-family: "Roboto Mono", ui-monospace, Menlo, monospace; }
  .live-badge { text-align: right; font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin: 0; }
  .live-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--black); margin-right: 5px; vertical-align: middle; }

  .calm-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 358px; gap: 14px; }
  .calm-mark { font-size: 64px; line-height: 1; }
  .calm-text { font-size: 18px; font-weight: 700; }
  .calm-sub { font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 11px; }

  .warnings-list { height: 358px; overflow: hidden; padding: 14px 20px 0; }
  .warning-card { border: 1.5px solid var(--black); border-radius: 4px; padding: 12px 14px; margin-bottom: 10px; }
  .warning-card.level-4, .warning-card.level-3 { border-width: 3px; }
  .warning-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .warning-event { font-size: 16px; font-weight: 800; margin: 0; }
  .warning-level { font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; white-space: nowrap; }
  .warning-headline { font-size: 12px; margin: 4px 0 0; line-height: 1.3; }
  .warning-time { font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 9px; margin: 8px 0 0; }

  .footer {
    position: absolute; left: 20px; right: 20px; bottom: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding-top: 7px; border-top: 1px solid var(--black);
    font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 8px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1;
  }
  .empty { padding: 40px 0; text-align: center; font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 11px; }
</style>
</head>
<body>
  <div class="frame">
    <header class="header">
      <div>
        <p class="brand">Wetterwarnung</p>
        <p class="subtitle">Landkreis Traunstein</p>
      </div>
      <p class="live-badge"><span class="live-dot"></span>LIVE</p>
    </header>

    <div id="content">
      <div class="empty">Loading...</div>
    </div>

    <footer class="footer">
      <span id="footerNote">Loading…</span>
      <span id="updatedAt">Updating</span>
    </footer>
  </div>

  <script>
    const RUDI_WORKER = "https://rudi.marvinradar.workers.dev";
    const REFRESH_INTERVAL_MS = 900000; // 15 Min -- DWD aktualisiert laut eigener Doku alle 30 Min

    const contentEl = document.getElementById("content");
    const footerNote = document.getElementById("footerNote");
    const updatedAt = document.getElementById("updatedAt");

    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // DWD nutzt CAP-Standardwerte (Minor/Moderate/Severe/Extreme) --
    // hier auf die in Deutschland gebräuchlichen Warnstufen 1-4
    // gemappt, für unmittelbares Verständnis ohne Nachschlagen.
    const SEVERITY_MAP = {
      Minor: { level: 1, label: "Stufe 1 · Wetterwarnung" },
      Moderate: { level: 2, label: "Stufe 2 · Markante Wetterwarnung" },
      Severe: { level: 3, label: "Stufe 3 · Unwetterwarnung" },
      Extreme: { level: 4, label: "Stufe 4 · Extreme Unwetterwarnung" },
    };

    function formatTimeRange(onsetMs, expiresMs) {
      const opts = { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" };
      const onset = onsetMs ? new Date(Number(onsetMs)).toLocaleString("de-DE", opts) : "?";
      const expires = expiresMs ? new Date(Number(expiresMs)).toLocaleString("de-DE", opts) : "?";
      return `${onset} bis ${expires} Uhr`;
    }

    function renderCalm() {
      contentEl.innerHTML = `
        <div class="calm-state">
          <span class="calm-mark">✓</span>
          <p class="calm-text">Keine Warnungen</p>
          <p class="calm-sub">Landkreis Traunstein, Stand siehe unten</p>
        </div>
      `;
    }

    function renderWarnings(warnings) {
      contentEl.innerHTML = `
        <div class="warnings-list">
          ${warnings.map((w) => {
            const sev = SEVERITY_MAP[w.severity] || { level: 0, label: w.severity || "Unbekannt" };
            return `
              <div class="warning-card level-${sev.level}">
                <div class="warning-top">
                  <p class="warning-event">${escapeHtml(w.event || "Warnung")}</p>
                  <span class="warning-level">${escapeHtml(sev.label)}</span>
                </div>
                <p class="warning-headline">${escapeHtml(w.headline || "")}</p>
                <p class="warning-time">${formatTimeRange(w.onset, w.expires)}</p>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    async function loadDisplay() {
      try {
        const response = await fetch(`${RUDI_WORKER}/warnings/traunstein`, {
          headers: { Accept: "application/json" }, cache: "no-store",
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        if (!data.warnings || data.warnings.length === 0) {
          renderCalm();
        } else {
          renderWarnings(data.warnings);
        }
        footerNote.textContent = `Quelle: DWD · ${data.count ?? 0} aktive Warnung(en)`;
      } catch (error) {
        console.error(error);
        contentEl.innerHTML = `<div class="empty">Warnungen gerade nicht verfügbar.</div>`;
        footerNote.textContent = "Update failed";
      }
      updatedAt.textContent = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" });
    }

    loadDisplay();
    setInterval(loadDisplay, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
