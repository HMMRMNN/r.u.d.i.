<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Training</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700;800&family=Roboto+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root { --black:#000000; --white:#ffffff; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--white); color:var(--black); }
    body {
      display: grid; place-items: center; font-family: "Work Sans", Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: none; text-rendering: optimizeSpeed;
    }
    .frame { position: relative; width: 800px; height: 480px; overflow: hidden; background: var(--white); border: 1px solid var(--black); }

    .header {
      position: absolute; top: 14px; left: 20px; right: 20px;
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 18px; padding-bottom: 8px; border-bottom: 1px solid var(--black);
    }
    .brand { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.22em; }
    .subtitle { margin: 4px 0 0; font-size: 11px; line-height: 1.1; font-family: "Roboto Mono", ui-monospace, Menlo, monospace; }
    .date-badge { text-align: right; font-family: "Roboto Mono", ui-monospace, Menlo, monospace; }
    .date-badge .day { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; }
    .date-badge .full { font-size: 10px; }

    .main {
      position: absolute; top: 58px; left: 20px; right: 20px; bottom: 34px;
      display: grid; grid-template-columns: 1fr 250px; gap: 0;
    }

    .left { padding-right: 16px; border-right: 1px solid var(--black); }
    .right { padding-left: 16px; display: flex; flex-direction: column; }

    h2 { margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

    /* ---- Bilanz-Kaesten ---- */
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 9px; }
    .stat-box { border: 1.5px solid var(--black); border-radius: 8px; padding: 10px 11px; text-align: left; }
    .stat-box .b-label { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .stat-box .b-main { font-family: "Work Sans", Arial, sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-top: 4px; line-height: 1; }
    .stat-box .b-unit { font-size: 11px; font-weight: 600; }
    .stat-box .b-sub { font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 9px; margin-top: 5px; line-height: 1.3; }

    /* ---- Jahresziel ---- */
    /* Jahresziel und Pizza teilen sich eine Zeile -- so bekommt die
       Pizza eine eigene Box, ohne zusaetzliche Hoehe zu kosten. */
    .goal-row { display: grid; grid-template-columns: 1fr 132px; gap: 10px; margin-bottom: 9px; }
    .goal { border: 1.5px solid var(--black); border-radius: 8px; padding: 9px 11px; }

    .pizza-box {
      border: 1.5px solid var(--black); border-radius: 8px; padding: 8px 10px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    .pizza-box .pz-count {
      font-family: "Work Sans", Arial, sans-serif; font-size: 24px; font-weight: 800;
      line-height: 1; letter-spacing: -0.02em; margin-top: 3px;
    }
    .pizza-box .pz-label { font-size: 9px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 3px; }
    .pizza-box .pz-kcal { font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 8px; margin-top: 3px; }
    .goal-head { display: flex; justify-content: space-between; align-items: baseline; font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 10px; }
    .goal-head strong { font-family: "Work Sans", Arial, sans-serif; font-size: 15px; font-weight: 800; }
    .bar { height: 14px; border: 1.5px solid var(--black); position: relative; overflow: hidden; }
    .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--black); }
    .bar-wrap { position: relative; margin-top: 7px; }
    /* Soll-Marke als Dreieck UNTER dem Balken. Ein Strich IM Balken
       waere unsichtbar, sobald die schwarze Fuellung darueber
       hinausreicht -- auf 1-Bit-E-Ink gibt es kein "dunkleres
       Schwarz". Deshalb ausserhalb der Fuellflaeche platziert. */
    .bar-target {
      position: absolute; bottom: -7px; width: 0; height: 0; margin-left: -4px;
      border-left: 4px solid transparent; border-right: 4px solid transparent;
      border-bottom: 6px solid var(--black);
    }
    .goal-foot { margin-top: 9px; font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 9px; }

    /* ---- Form & Leistung ---- */
    .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .panel { border: 1.5px solid var(--black); border-radius: 8px; padding: 9px 11px; }
    .panel .p-head { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
    .kv { display: flex; justify-content: space-between; align-items: baseline;
          font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 10px;
          padding: 3px 0; border-bottom: 1px solid #000; }
    .kv:last-child { border-bottom: none; }
    .kv .k { }
    .kv .v { font-weight: 700; font-size: 12px; }
    .form-main { font-family: "Work Sans", Arial, sans-serif; font-size: 22px; font-weight: 800;
                 line-height: 1; letter-spacing: -0.02em; margin-bottom: 5px; }
    .form-main .fm-unit { font-size: 10px; font-weight: 600; }
    .spark { display: block; margin-top: 6px; }

    /* ---- Letzte Fahrten ---- */
    .rides { margin: 0; padding: 0; list-style: none; }
    .rides li { padding: 4px 0; border-bottom: 1px dashed #000; }
    .rides li:last-child { border-bottom: none; }
    /* Zahlen stehen vorn, nicht der Name: die Aktivitaeten heissen
       beim Import fast immer gleich ("Cycling") und tragen damit
       keine Information. km und Schnitt schon. */
    .rides .r-main {
      display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
      font-family: "Roboto Mono", ui-monospace, Menlo, monospace;
    }
    .rides .r-km { font-family: "Work Sans", Arial, sans-serif; font-size: 13px; font-weight: 800; letter-spacing: -0.01em; }
    .rides .r-km .r-unit { font-size: 9px; font-weight: 600; }
    .rides .r-speed { font-size: 11px; font-weight: 700; }
    .rides .r-meta { font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 8.5px; margin-top: 2px; }

    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; height: 100%; }
    .empty .headline { font-size: 18px; font-weight: 800; }
    .empty .sub { font-family: "Roboto Mono", ui-monospace, Menlo, monospace; font-size: 11px; }

    .footer {
      position: absolute; left: 20px; right: 20px; bottom: 10px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding-top: 7px; border-top: 1px solid var(--black);
      font-family: "Roboto Mono", ui-monospace, Menlo, monospace;
      font-size: 8px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1;
    }
  </style>
</head>

<body>
  <main class="frame">
    <header class="header">
      <div>
        <p class="brand">TRAINING &middot; RAD</p>
        <p class="subtitle" id="subtitle">L&auml;dt&hellip;</p>
      </div>
      <div class="date-badge">
        <div class="day" id="dayName">&ndash;</div>
        <div class="full" id="fullDate">&ndash;</div>
      </div>
    </header>

    <section class="main" id="main">
      <div class="left"><div class="empty"><div class="headline">L&auml;dt&hellip;</div></div></div>
      <div class="right"></div>
    </section>

    <footer class="footer">
      <span>Eigene Aktivit&auml;ten &middot; intervals.icu</span>
      <span id="updatedAt">Updating</span>
    </footer>
  </main>

  <script>
    "use strict";

    const TRAINING_API = "https://rudi.marvinradar.workers.dev/training";
    const REFRESH_INTERVAL_MS = 30 * 60 * 1000;

    const mainEl = document.getElementById("main");
    const subtitle = document.getElementById("subtitle");
    const updatedAt = document.getElementById("updatedAt");
    const dayName = document.getElementById("dayName");
    const fullDate = document.getElementById("fullDate");

    // "3:51 h" liest sich bei langen Fahrten besser als "231 min".
    function formatDuration(minutes) {
      if (!minutes) return "\u2013";
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      return h > 0 ? `${h}:${String(m).padStart(2, "0")} h` : `${m} min`;
    }

    function weekdayShort(iso) {
      if (!iso) return "";
      const d = new Date(iso + "T12:00:00");
      return d.toLocaleDateString("de-DE", { weekday: "short", timeZone: "Europe/Berlin" });
    }

    function formatDate(iso) {
      if (!iso) return "";
      const d = new Date(iso + "T12:00:00");
      return d.toLocaleDateString("de-DE", { day: "2-digit", month: "short", timeZone: "Europe/Berlin" });
    }

    function formatTime(iso) {
      if (!iso) return null;
      return new Date(iso).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" });
    }

    // Wie viel Prozent des Jahres sind vorbei -- als Referenzmarke im
    // Fortschrittsbalken. Zeigt auf einen Blick, ob man vor oder
    // hinter dem gleichmaessig verteilten Soll liegt.
    function yearProgressPercent() {
      const now = new Date(new Date().toLocaleString("en-US", { timeZone: "Europe/Berlin" }));
      const start = new Date(now.getFullYear(), 0, 1);
      const end = new Date(now.getFullYear() + 1, 0, 1);
      return ((now - start) / (end - start)) * 100;
    }

    // Kleine Fitness-Kurve als SVG. Bewusst nur Umriss in echtem
    // Schwarz -- Graustufen verschwinden beim 1-Bit-Threshold.
    function sparkline(values, width, height) {
      if (!values || values.length < 2) return "";
      const min = Math.min(...values);
      const max = Math.max(...values);
      const span = max - min || 1;
      const step = width / (values.length - 1);
      const points = values
        .map((v, i) => `${(i * step).toFixed(1)},${(height - ((v - min) / span) * height).toFixed(1)}`)
        .join(" ");
      return `<svg class="spark" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
        <polyline points="${points}" fill="none" stroke="#000" stroke-width="1.5" />
      </svg>`;
    }

    // Form in Worte fassen. Die Schwellen folgen der gaengigen
    // TSB-Auslegung im Ausdauertraining.
    function formLabel(form) {
      if (form == null) return "";
      if (form > 15) return "sehr frisch";
      if (form > 5) return "frisch";
      if (form >= -10) return "ausgeglichen";
      if (form >= -25) return "belastet";
      return "stark belastet";
    }

    async function load() {
      const now = new Date();
      dayName.textContent = now.toLocaleDateString("de-DE", { weekday: "long", timeZone: "Europe/Berlin" }).toUpperCase();
      fullDate.textContent = now.toLocaleDateString("de-DE", { day: "2-digit", month: "long", year: "numeric", timeZone: "Europe/Berlin" });

      try {
        const res = await fetch(TRAINING_API, { headers: { Accept: "application/json" }, cache: "no-store" });
        const data = await res.json();

        if (!res.ok || data.error) {
          renderError(data);
        } else {
          render(data);
        }

        updatedAt.textContent = `Updated ${now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" })}`;
      } catch (error) {
        console.error(error);
        renderError({ detail: "Verbindung fehlgeschlagen" });
        updatedAt.textContent = "Update failed";
      }
    }

    function renderError(data) {
      subtitle.textContent = "Nicht verf\u00fcgbar";
      mainEl.querySelector(".left").innerHTML = `
        <div class="empty">
          <div class="headline">Noch nicht verbunden</div>
          <div class="sub">${data.detail || "Keine Daten"}</div>
        </div>`;
      mainEl.querySelector(".right").innerHTML = "";
    }

    function render(data) {
      const stand = formatTime(data.fetchedAt);
      subtitle.textContent = stand ? `Stand: ${stand} Uhr` : "Radfahren";

      const goalKm = data.goalKm || 0;
      const yearKm = data.year.km || 0;
      const pct = goalKm ? Math.min((yearKm / goalKm) * 100, 100) : 0;
      const targetPct = yearProgressPercent();
      const remaining = Math.max(goalKm - yearKm, 0);

      // Ein Stueck Pizza Margherita liegt bei grob 285 kcal. Bewusst
      // ein Richtwert, keine exakte Rechnung -- die Kalorienangabe
      // vom Rad ist selbst schon eine Schaetzung.
      const KCAL_PRO_PIZZASTUECK = 285;
      const yearKcal = data.year.kcal || 0;
      const pizzaStuecke = Math.floor(yearKcal / KCAL_PRO_PIZZASTUECK);
      // Pizzastueck-Icon als SVG: nur schwarze Konturen, keine
      // Graustufen -- Fuellungen in Grau wuerden beim 1-Bit-Threshold
      // entweder ganz verschwinden oder zu Vollschwarz kippen.
      const pizzaIcon = `<svg width="26" height="26" viewBox="0 0 26 26">
          <path d="M13 3 L23 21 Q13 25 3 21 Z" fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M4.6 17.6 Q13 21.2 21.4 17.6" fill="none" stroke="#000" stroke-width="1.3"/>
          <circle cx="11" cy="11" r="1.5" fill="#000"/>
          <circle cx="16" cy="15" r="1.5" fill="#000"/>
          <circle cx="9.5" cy="16" r="1.3" fill="#000"/>
        </svg>`;

      const pizzaBox = yearKcal > 0
        ? `<div class="pizza-box">
             ${pizzaIcon}
             <div class="pz-count">${pizzaStuecke}</div>
             <div class="pz-label">St&uuml;ck Pizza</div>
             <div class="pz-kcal">${yearKcal.toLocaleString("de-DE")} kcal ${new Date().getFullYear()}</div>
           </div>`
        : "";

      const w = data.wellness;
      const formPanel = w
        ? `<div class="panel">
             <div class="p-head">Form</div>
             <div class="form-main">${w.form > 0 ? "+" : ""}${w.form ?? "\u2013"}<span class="fm-unit">&nbsp;&nbsp;${formLabel(w.form)}</span></div>
             <div class="kv"><span class="k">Fitness (CTL)</span><span class="v">${w.fitness ?? "\u2013"}${w.ctlTrend != null ? ` <span style="font-size:9px;">(${w.ctlTrend >= 0 ? "+" : ""}${w.ctlTrend}/4Wo)</span>` : ""}</span></div>
             <div class="kv"><span class="k">Erm&uuml;dung (ATL)</span><span class="v">${w.fatigue ?? "\u2013"}</span></div>
             ${sparkline(w.history, 200, 26)}
           </div>`
        : `<div class="panel"><div class="p-head">Form</div>
             <div class="kv"><span class="k">Keine Wellness-Daten</span></div></div>`;

      const p = data.power;
      const powerPanel = p
        ? `<div class="panel">
             <div class="p-head">Leistung</div>
             ${p.eftp != null ? `<div class="kv"><span class="k">eFTP</span><span class="v">${p.eftp} W</span></div>` : ""}
             ${p.bestWatts != null ? `<div class="kv"><span class="k">Beste NP ${new Date().getFullYear()}</span><span class="v">${p.bestWatts} W</span></div>` : ""}
             ${p.bestLoad != null ? `<div class="kv"><span class="k">H&ouml;chste Last</span><span class="v">${p.bestLoad}</span></div>` : ""}
             ${p.longestRideKm != null ? `<div class="kv"><span class="k">L&auml;ngste Fahrt</span><span class="v">${p.longestRideKm} km</span></div>` : ""}
           </div>`
        : `<div class="panel"><div class="p-head">Leistung</div>
             <div class="kv"><span class="k">Keine Leistungsdaten</span></div></div>`;

      const left = `
        <h2>Bilanz</h2>
        <div class="stat-grid">
          <div class="stat-box">
            <div class="b-label">Diese Woche</div>
            <div class="b-main">${data.week.km}<span class="b-unit"> km</span></div>
            <div class="b-sub">${data.week.elevation} hm &middot; ${data.week.hours} h<br>${data.week.count} Fahrten</div>
          </div>
          <div class="stat-box">
            <div class="b-label">Diesen Monat</div>
            <div class="b-main">${data.month.km}<span class="b-unit"> km</span></div>
            <div class="b-sub">${data.month.elevation} hm &middot; ${data.month.hours} h<br>${data.month.count} Fahrten</div>
          </div>
          <div class="stat-box">
            <div class="b-label">Dieses Jahr</div>
            <div class="b-main">${data.year.km}<span class="b-unit"> km</span></div>
            <div class="b-sub">${data.year.elevation} hm &middot; ${data.year.hours} h<br>${data.year.count} Fahrten</div>
          </div>
        </div>

        <h2>Jahresziel</h2>
        <div class="goal-row">
          <div class="goal">
          <div class="goal-head">
            <span><strong>${yearKm}</strong> von ${goalKm} km</span>
            <span>${Math.round(pct)} %</span>
          </div>
          <div class="bar-wrap">
            <div class="bar">
              <div class="bar-fill" style="width:${pct}%"></div>
            </div>
            <div class="bar-target" style="left:${targetPct}%"></div>
          </div>
            <div class="goal-foot">Noch ${remaining} km &middot; Marke = Soll zum heutigen Tag (${Math.round(targetPct)} %)</div>
          </div>
          ${pizzaBox}
        </div>

        <div class="duo">
          ${formPanel}
          ${powerPanel}
        </div>
      `;

      const rides = (data.recent || []).length
        ? `<ul class="rides">${data.recent.map((r) => `
            <li>
              <div class="r-main">
                <span class="r-km">${r.km}<span class="r-unit"> km</span></span>
                <span class="r-speed">${r.speed != null ? r.speed + " km/h" : ""}</span>
              </div>
              <div class="r-meta">${weekdayShort(r.date)}, ${formatDate(r.date)} &middot; ${r.elevation} hm &middot; ${formatDuration(r.minutes)}</div>
            </li>`).join("")}</ul>`
        : `<p style="font-size:11px;">Noch keine Fahrten erfasst</p>`;

      mainEl.querySelector(".left").innerHTML = left;
      mainEl.querySelector(".right").innerHTML = `<h2>Letzte Fahrten</h2>${rides}`;
    }

    load();
    setInterval(load, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
