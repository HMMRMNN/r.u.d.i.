<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Training</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ---------------------------------------------------------------
       Gleiches Design-System wie weather.html (v2): keine Boxen/Rahmen
       um Inhalte -- Struktur entsteht durch Typografie-Hierarchie und
       Weißraum, nur die äußere Frame-Kontur bleibt als durchgezogene
       Linie. Streng monochrom, invertiert (schwarzer Hintergrund).
       Gleiche Daten/Fetch-Logik wie bisher, nur Layout/Optik neu.
    --------------------------------------------------------------- */
    :root { --black:#ffffff; --white:#000000; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--white); color:var(--black); }
    body {
      display: grid; place-items: center; font-family: "Inter", Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: none; text-rendering: optimizeSpeed;
    }
    .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }

    .frame { position: relative; width: 800px; height: 480px; overflow: hidden; background: var(--white); border: 1px solid var(--black); }
    .canvas { position: absolute; top: 30px; left: 34px; right: 34px; bottom: 40px; display: flex; flex-direction: column; }

    .masthead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .mast-left { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5; }
    .mast-right { font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.5; }
    .status-line { font-size: 12px; opacity: 0.6; margin-bottom: 16px; }

    .col-label { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5; margin-bottom: 6px; }

    .split { display: flex; gap: 44px; flex: 1; min-height: 0; }
    .split-col.wide { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .split-col.narrow { flex: 0 0 220px; display: flex; flex-direction: column; overflow: hidden; }

    .bilanz-row { display: flex; gap: 28px; }
    .bilanz-item { flex: 1; }
    .bilanz-value { font-size: 30px; font-weight: 200; letter-spacing: -0.02em; margin-top: 2px; }
    .bilanz-unit { font-size: 13px; font-weight: 300; opacity: 0.7; }
    .bilanz-sub { margin-top: 2px; font-size: 10px; opacity: 0.5; }

    .section-block { margin-top: 16px; }
    .goal-head-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
    .goal-bar-wrap { position: relative; margin-top: 8px; }
    .goal-bar-track { height: 3px; background: rgba(255,255,255,0.18); }
    .goal-bar-fill { height: 100%; background: var(--black); }
    .goal-target {
      position: absolute; bottom: -6px; width: 0; height: 0; margin-left: -4px;
      border-left: 4px solid transparent; border-right: 4px solid transparent;
      border-bottom: 5px solid var(--black); opacity: 0.7;
    }
    .goal-foot-row { margin-top: 9px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .goal-foot { font-size: 10.5px; opacity: 0.55; }
    .pizza-inline { display: flex; align-items: center; gap: 6px; font-size: 10.5px; opacity: 0.75; flex-shrink: 0; }
    .pizza-inline svg { flex-shrink: 0; }

    .duo { display: flex; gap: 36px; }
    .duo-col { flex: 1; min-width: 0; }
    .form-value-big { font-size: 20px; font-weight: 300; margin-top: 2px; }
    .kv-row { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; padding: 2px 0; }
    .kv-row .k { opacity: 0.55; }
    .kv-row .v { font-weight: 600; }
    .spark { display: block; margin-top: 6px; color: var(--black); }

    .ride-list { display: flex; flex-direction: column; gap: 10px; overflow-y: hidden; }
    .ride-entry-main { display: flex; justify-content: space-between; align-items: baseline; }
    .ride-entry-km { font-size: 16px; font-weight: 600; }
    .ride-entry-unit { font-size: 10px; font-weight: 400; opacity: 0.6; }
    .ride-entry-speed { font-size: 11px; opacity: 0.7; }
    .ride-entry-meta { margin-top: 2px; font-size: 10px; opacity: 0.5; }

    .empty { padding-top: 4px; }
    .empty .headline { font-size: 18px; font-weight: 400; }
    .empty .sub { margin-top: 6px; font-size: 12px; opacity: 0.6; }

    .footer {
      position: absolute; left: 34px; right: 34px; bottom: 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      font-size: 8.5px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1; opacity: 0.45;
    }
  </style>
</head>

<body>
  <main class="frame">
    <div class="canvas">
      <div class="masthead">
        <span class="mast-left mono">R.U.D.I. &middot; Training &middot; Rad</span>
        <span class="mast-right mono" id="mastDate">&ndash;</span>
      </div>
      <p class="status-line mono" id="subtitle">L&auml;dt&hellip;</p>

      <div class="split" id="main">
        <div class="split-col wide"><div class="empty"><div class="headline">L&auml;dt&hellip;</div></div></div>
        <div class="split-col narrow"></div>
      </div>
    </div>

    <footer class="footer mono">
      <span>Eigene Aktivit&auml;ten &middot; intervals.icu</span>
      <span id="updatedAt">Updating</span>
    </footer>
  </main>

  <script>
    "use strict";

    const TRAINING_API = "https://rudi.marvinradar.workers.dev/training";
    const REFRESH_INTERVAL_MS = 30 * 60 * 1000;

    const mainEl = document.getElementById("main");
    const subtitle = document.getElementById("subtitle");
    const updatedAt = document.getElementById("updatedAt");
    const mastDate = document.getElementById("mastDate");

    // "3:51 h" liest sich bei langen Fahrten besser als "231 min".
    function formatDuration(minutes) {
      if (!minutes) return "–";
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      return h > 0 ? `${h}:${String(m).padStart(2, "0")} h` : `${m} min`;
    }

    function weekdayShort(iso) {
      if (!iso) return "";
      const d = new Date(iso + "T12:00:00");
      return d.toLocaleDateString("de-DE", { weekday: "short", timeZone: "Europe/Berlin" });
    }

    function formatDate(iso) {
      if (!iso) return "";
      const d = new Date(iso + "T12:00:00");
      return d.toLocaleDateString("de-DE", { day: "2-digit", month: "short", timeZone: "Europe/Berlin" });
    }

    function formatTime(iso) {
      if (!iso) return null;
      return new Date(iso).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" });
    }

    // Wie viel Prozent des Jahres sind vorbei -- als Referenzmarke im
    // Fortschrittsbalken. Zeigt auf einen Blick, ob man vor oder
    // hinter dem gleichmaessig verteilten Soll liegt.
    function yearProgressPercent() {
      const now = new Date(new Date().toLocaleString("en-US", { timeZone: "Europe/Berlin" }));
      const start = new Date(now.getFullYear(), 0, 1);
      const end = new Date(now.getFullYear() + 1, 0, 1);
      return ((now - start) / (end - start)) * 100;
    }

    // Kleine Fitness-Kurve als SVG. currentColor -- auf dem invertierten
    // (schwarzen) Hintergrund entsprechend weiß statt hartcodiert schwarz.
    function sparkline(values, width, height) {
      if (!values || values.length < 2) return "";
      const min = Math.min(...values);
      const max = Math.max(...values);
      const span = max - min || 1;
      const step = width / (values.length - 1);
      const points = values
        .map((v, i) => `${(i * step).toFixed(1)},${(height - ((v - min) / span) * height).toFixed(1)}`)
        .join(" ");
      return `<svg class="spark" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
        <polyline points="${points}" fill="none" stroke="currentColor" stroke-width="1.5" />
      </svg>`;
    }

    // Form in Worte fassen. Die Schwellen folgen der gaengigen
    // TSB-Auslegung im Ausdauertraining.
    function formLabel(form) {
      if (form == null) return "";
      if (form > 15) return "sehr frisch";
      if (form > 5) return "frisch";
      if (form >= -10) return "ausgeglichen";
      if (form >= -25) return "belastet";
      return "stark belastet";
    }

    async function load() {
      const now = new Date();
      const dayName = now.toLocaleDateString("de-DE", { weekday: "long", timeZone: "Europe/Berlin" }).toUpperCase();
      const fullDate = now.toLocaleDateString("de-DE", { day: "2-digit", month: "long", year: "numeric", timeZone: "Europe/Berlin" });
      mastDate.textContent = `${dayName} · ${fullDate}`;

      try {
        const res = await fetch(TRAINING_API, { headers: { Accept: "application/json" }, cache: "no-store" });
        const data = await res.json();

        if (!res.ok || data.error) {
          renderError(data);
        } else {
          render(data);
        }

        updatedAt.textContent = `Updated ${now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" })}`;
      } catch (error) {
        console.error(error);
        renderError({ detail: "Verbindung fehlgeschlagen" });
        updatedAt.textContent = "Update failed";
      }
    }

    function renderError(data) {
      subtitle.textContent = "Nicht verfügbar";
      mainEl.querySelector(".split-col.wide").innerHTML = `
        <div class="empty">
          <div class="headline">Noch nicht verbunden</div>
          <div class="sub mono">${data.detail || "Keine Daten"}</div>
        </div>`;
      mainEl.querySelector(".split-col.narrow").innerHTML = "";
    }

    function render(data) {
      const stand = formatTime(data.fetchedAt);
      subtitle.textContent = stand ? `Stand: ${stand} Uhr` : "Radfahren";

      const goalKm = data.goalKm || 0;
      const yearKm = data.year.km || 0;
      const pct = goalKm ? Math.min((yearKm / goalKm) * 100, 100) : 0;
      const targetPct = yearProgressPercent();
      const remaining = Math.max(goalKm - yearKm, 0);

      // Ein Stueck Pizza Margherita liegt bei grob 285 kcal. Bewusst
      // ein Richtwert, keine exakte Rechnung -- die Kalorienangabe
      // vom Rad ist selbst schon eine Schaetzung.
      const KCAL_PRO_PIZZASTUECK = 285;
      const yearKcal = data.year.kcal || 0;
      const pizzaStuecke = Math.floor(yearKcal / KCAL_PRO_PIZZASTUECK);
      // Pizzastueck-Icon als SVG: nur Konturen in currentColor, keine
      // Graustufen -- Fuellungen in Grau wuerden beim 1-Bit-Threshold
      // entweder ganz verschwinden oder zu Vollflaeche kippen.
      const pizzaIcon = `<svg width="18" height="18" viewBox="0 0 26 26">
          <path d="M13 3 L23 21 Q13 25 3 21 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M4.6 17.6 Q13 21.2 21.4 17.6" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <circle cx="11" cy="11" r="1.5" fill="currentColor"/>
          <circle cx="16" cy="15" r="1.5" fill="currentColor"/>
          <circle cx="9.5" cy="16" r="1.3" fill="currentColor"/>
        </svg>`;

      const pizzaInline = yearKcal > 0
        ? `<div class="pizza-inline">${pizzaIcon}<span>${pizzaStuecke} St&uuml;ck Pizza (${yearKcal.toLocaleString("de-DE")} kcal ${new Date().getFullYear()})</span></div>`
        : "";

      const w = data.wellness;
      const formPanel = w
        ? `<div class="duo-col">
             <p class="col-label">Form</p>
             <div class="form-value-big">${w.form > 0 ? "+" : ""}${w.form ?? "–"} <span style="font-size:11px; font-weight:400; opacity:0.6;">${formLabel(w.form)}</span></div>
             <div class="kv-row"><span class="k">Fitness (CTL)</span><span class="v">${w.fitness ?? "–"}${w.ctlTrend != null ? ` <span style="opacity:0.6; font-weight:400;">(${w.ctlTrend >= 0 ? "+" : ""}${w.ctlTrend}/4Wo)</span>` : ""}</span></div>
             <div class="kv-row"><span class="k">Erm&uuml;dung (ATL)</span><span class="v">${w.fatigue ?? "–"}</span></div>
             ${sparkline(w.history, 190, 24)}
           </div>`
        : `<div class="duo-col"><p class="col-label">Form</p><div class="kv-row"><span class="k">Keine Wellness-Daten</span></div></div>`;

      const p = data.power;
      const powerPanel = p
        ? `<div class="duo-col">
             <p class="col-label">Leistung</p>
             ${p.eftp != null ? `<div class="kv-row"><span class="k">eFTP</span><span class="v">${p.eftp} W</span></div>` : ""}
             ${p.bestWatts != null ? `<div class="kv-row"><span class="k">Beste NP ${new Date().getFullYear()}</span><span class="v">${p.bestWatts} W</span></div>` : ""}
             ${p.bestLoad != null ? `<div class="kv-row"><span class="k">H&ouml;chste Last</span><span class="v">${p.bestLoad}</span></div>` : ""}
             ${p.longestRideKm != null ? `<div class="kv-row"><span class="k">L&auml;ngste Fahrt</span><span class="v">${p.longestRideKm} km</span></div>` : ""}
           </div>`
        : `<div class="duo-col"><p class="col-label">Leistung</p><div class="kv-row"><span class="k">Keine Leistungsdaten</span></div></div>`;

      const left = `
        <p class="col-label">Bilanz</p>
        <div class="bilanz-row">
          <div class="bilanz-item">
            <p class="col-label" style="opacity:0.6;">Diese Woche</p>
            <div class="bilanz-value">${data.week.km}<span class="bilanz-unit"> km</span></div>
            <div class="bilanz-sub mono">${data.week.elevation} hm &middot; ${data.week.hours} h &middot; ${data.week.count} Fahrten</div>
          </div>
          <div class="bilanz-item">
            <p class="col-label" style="opacity:0.6;">Diesen Monat</p>
            <div class="bilanz-value">${data.month.km}<span class="bilanz-unit"> km</span></div>
            <div class="bilanz-sub mono">${data.month.elevation} hm &middot; ${data.month.hours} h &middot; ${data.month.count} Fahrten</div>
          </div>
          <div class="bilanz-item">
            <p class="col-label" style="opacity:0.6;">Dieses Jahr</p>
            <div class="bilanz-value">${data.year.km}<span class="bilanz-unit"> km</span></div>
            <div class="bilanz-sub mono">${data.year.elevation} hm &middot; ${data.year.hours} h &middot; ${data.year.count} Fahrten</div>
          </div>
        </div>

        <div class="section-block">
          <div class="goal-head-row">
            <span class="col-label" style="margin:0;">Jahresziel</span>
            <span class="mono"><strong>${yearKm}</strong> von ${goalKm} km &middot; ${Math.round(pct)}%</span>
          </div>
          <div class="goal-bar-wrap">
            <div class="goal-bar-track"><div class="goal-bar-fill" style="width:${pct}%"></div></div>
            <div class="goal-target" style="left:${targetPct}%"></div>
          </div>
          <div class="goal-foot-row">
            <span class="goal-foot mono">Noch ${remaining} km &middot; Marke = Soll zum heutigen Tag (${Math.round(targetPct)}%)</span>
            ${pizzaInline}
          </div>
        </div>

        <div class="section-block duo">
          ${formPanel}
          ${powerPanel}
        </div>
      `;

      const rides = (data.recent || []).length
        ? `<div class="ride-list">${data.recent.map((r) => `
            <div>
              <div class="ride-entry-main">
                <span class="ride-entry-km">${r.km}<span class="ride-entry-unit"> km</span></span>
                <span class="ride-entry-speed mono">${r.speed != null ? r.speed + " km/h" : ""}</span>
              </div>
              <div class="ride-entry-meta mono">${weekdayShort(r.date)}, ${formatDate(r.date)} &middot; ${r.elevation} hm &middot; ${formatDuration(r.minutes)}</div>
            </div>`).join("")}</div>`
        : `<p style="font-size:11px; opacity:0.6;">Noch keine Fahrten erfasst</p>`;

      mainEl.querySelector(".split-col.wide").innerHTML = left;
      mainEl.querySelector(".split-col.narrow").innerHTML = `<p class="col-label">Letzte Fahrten</p>${rides}`;
    }

    load();
    setInterval(load, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
