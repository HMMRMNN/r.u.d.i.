<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#000000" />
<title>R.U.D.I. — Flying Bulls</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
  rel="stylesheet"
/>

<!-- Gleiche lokale Leaflet-Einbindung wie desktop.html (kein CDN-Key
     nötig, siehe dortiger Kommentar) -- für die Live-Karte unten. -->
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<script src="vendor/leaflet/leaflet.js"></script>

<style>
  /* ---------------------------------------------------------------
     Gleiches Design-System wie iphone.html (Zinc-Dunkelpalette,
     Inter/JetBrains Mono, Live-Dot) für visuelle Konsistenz -- aber
     eigenständige, normal scrollende Seite statt App-Shell mit
     Swipe-Screens: hier gibt es nur einen einzigen Inhalt (Flying-
     Bulls-Status), kein Grund für die Carousel-Mechanik.

     Als Homescreen-Link auf dem iPhone gedacht (apple-mobile-web-app-
     capable, safe-area-Insets), funktioniert aber genauso als normale
     Seite auf dem Rechner -- responsiver Container statt fixer
     Displaybreite, kein E-Ink-Frame/Pipeline-Constraint hier.
  --------------------------------------------------------------- */
  :root {
    --bg: #000000;
    --panel: #0a0a0b;
    --panel-soft: #0d0d0f;
    --line: #27272a;
    --line-soft: #18181b;
    --ink: #ffffff;
    --ink-dim: #d4d4d8;
    --ink-body: #a1a1aa;
    --ink-label: #71717a;
    --ink-faint: #52525b;
    --ink-ghost: #3f3f46;
    --red: #ef4444;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --sans: "Inter", -apple-system, "Segoe UI", Arial, sans-serif;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--ink-body);
    font-family: var(--sans);
  }

  header.top {
    position: sticky; top: 0; z-index: 10;
    padding: calc(10px + var(--safe-t)) calc(16px + var(--safe-r)) 10px calc(16px + var(--safe-l));
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--panel-soft); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-faint); }
  .brand b { color: var(--ink-dim); font-weight: 500; letter-spacing: 0.22em; }
  .status-row { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-label); }

  @keyframes pulse-glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; background: var(--red); box-shadow: 0 0 8px rgba(239,68,68,0.6); animation: pulse-glow 1.6s ease-in-out infinite; }
  .live-dot.calm { background: var(--ink-ghost); box-shadow: none; animation: none; }

  button.refresh {
    background: none; border: 1px solid var(--line); color: var(--ink-faint);
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 6px 10px; cursor: pointer;
  }
  button.refresh:active { color: var(--ink-dim); border-color: var(--ink-ghost); }

  main {
    max-width: 640px;
    padding: 20px calc(16px + var(--safe-r)) calc(32px + var(--safe-b)) calc(16px + var(--safe-l));
  }

  h1 { font-size: clamp(22px, 5vw, 30px); font-weight: 300; letter-spacing: -0.03em; color: var(--ink); margin: 4px 0 4px; }
  .subtitle { font-size: 13px; color: var(--ink-faint); margin: 0 0 22px; line-height: 1.5; }

  .card { border: 1px solid var(--line); background: var(--panel); padding: 16px; margin-bottom: 14px; }
  .card.is-airborne { border-color: var(--red); }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card-top-main { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
  .card-photo { width: 56px; height: 56px; object-fit: cover; border: 1px solid var(--line); background: var(--bg); flex-shrink: 0; display: block; }
  .card-title { font-size: 17px; font-weight: 500; color: var(--ink); }
  .card-sub { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); margin-top: 3px; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 9px; border: 1px solid var(--ink-ghost);
    color: var(--ink-dim); white-space: nowrap; flex-shrink: 0;
  }
  .pill.is-airborne { border-color: var(--red); color: var(--red); }
  .pill.is-landed { border-color: var(--line); color: var(--ink-faint); }

  .route { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 15px; color: var(--ink-dim); }
  .route .city { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .route .city.dest { text-align: right; }
  .route .arrow { color: var(--ink-faint); flex-shrink: 0; }
  .route .unknown { color: var(--ink-faint); }

  .stat-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .stat { flex: 1 1 80px; }
  .stat-label { font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-label); margin-bottom: 4px; }
  .stat-value { font-size: 20px; font-weight: 300; color: var(--ink); letter-spacing: -0.01em; }
  .stat-value.compact { font-size: 16px; }
  .stat-unit { font-size: 12px; color: var(--ink-faint); margin-left: 2px; }

  .meta { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); margin-top: 12px; line-height: 1.6; }

  .empty { border: 1px solid var(--line); background: var(--panel); padding: 16px; color: var(--ink-faint); font-size: 13px; line-height: 1.6; }
  .empty b { color: var(--ink-dim); }
  .empty.small { font-size: 12.5px; padding: 14px 16px; }

  .section-head { margin: 32px 0 12px; }
  .section-head h2 { font-size: 15px; font-weight: 500; color: var(--ink-dim); margin: 0; }
  .section-sub { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); margin: 3px 0 0; }

  .archive-date-header { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-label); margin: 18px 0 8px; }
  .archive-date-header:first-child { margin-top: 0; }

  .archive-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
  .archive-row:last-child { border-bottom: none; }
  .archive-left { min-width: 0; display: flex; align-items: flex-start; gap: 10px; }
  .archive-photo { width: 34px; height: 34px; object-fit: cover; border: 1px solid var(--line); background: var(--bg); flex-shrink: 0; display: block; }
  .archive-left-text { min-width: 0; }
  .archive-type-line { font-size: 14px; color: var(--ink-dim); font-weight: 500; }
  .archive-type-line .reg { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); font-weight: 400; margin-left: 6px; }
  .archive-route-line { font-size: 12.5px; color: var(--ink-body); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .archive-right { flex-shrink: 0; text-align: right; font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); line-height: 1.5; }

  .map-box { position: relative; border: 1px solid var(--line); height: 260px; margin-bottom: 14px; overflow: hidden; }
  #liveMap { width: 100%; height: 100%; background: #0a0a0b; }
  .map-empty-overlay { position: absolute; z-index: 400; pointer-events: none; color: var(--ink-faint); font-size: 12.5px; }
  .map-empty-overlay.full {
    inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(10,10,11,0.72); text-align: center; padding: 20px;
  }
  .map-empty-overlay.badge {
    /* unten links statt oben links -- die Leaflet-Zoom-Buttons sitzen
       oben links und würden die Badge sonst überlappen. */
    bottom: 8px; left: 8px; max-width: calc(100% - 16px); background: rgba(10,10,11,0.82);
    border: 1px solid var(--line); padding: 6px 10px; font-family: var(--mono); font-size: 11px; line-height: 1.5; text-align: left;
  }
  .map-empty-overlay.badge b { color: var(--ink-dim); font-weight: 500; }
  .leaflet-container { background: #0a0a0b; font-family: var(--mono); }
  .leaflet-control-attribution { background: rgba(10,10,11,0.75) !important; color: var(--ink-faint) !important; font-size: 9px !important; }
  .leaflet-control-attribution a { color: var(--ink-faint) !important; }
  .leaflet-control-zoom a { background: var(--panel) !important; border-color: var(--line) !important; color: var(--ink-dim) !important; border-radius: 0 !important; }
</style>
</head>
<body>
  <header class="top">
    <span class="brand"><b>R.U.D.I.</b> &middot; Flying Bulls</span>
    <span class="status-row">
      <span class="live-dot calm" id="liveDot"></span>
      <span id="statusText">Lädt&hellip;</span>
      <button class="refresh" id="refreshBtn" type="button">&#8635;</button>
    </span>
  </header>

  <main>
    <h1>Flying Bulls</h1>
    <p class="subtitle">Live-Status der Flying-Bulls-Flotte &mdash; wo sie gerade fliegen, oder von wo nach wo sie zuletzt geflogen sind.</p>

    <div class="map-box">
      <div id="liveMap"></div>
      <div class="map-empty-overlay full" id="mapEmptyOverlay" style="display:flex">Aktuell keine Flying Bulls in der Luft.</div>
    </div>

    <div id="content"><div class="empty">Lädt&hellip;</div></div>

    <div class="section-head">
      <h2>Statistik</h2>
      <p class="section-sub">Abgeleitet aus dem Archiv.</p>
    </div>
    <div id="statsBox"><div class="empty small">Lädt&hellip;</div></div>

    <div class="section-head">
      <h2>Archiv</h2>
      <p class="section-sub">Abgeschlossene Flüge, neueste zuerst.</p>
    </div>
    <div id="archiveList"><div class="empty small">Lädt&hellip;</div></div>
  </main>

  <script>
    "use strict";

    const RUDI_WORKER = "https://rudi.marvinradar.workers.dev";
    const STATUS_URL = `${RUDI_WORKER}/flyingbulls/status`;
    const ARCHIVE_URL = `${RUDI_WORKER}/flyingbulls/archive?limit=30`;
    const STATS_URL = `${RUDI_WORKER}/flyingbulls/stats`;
    const REFRESH_MS = 30000;

    const liveDot = document.getElementById("liveDot");
    const statusText = document.getElementById("statusText");
    const content = document.getElementById("content");
    const archiveList = document.getElementById("archiveList");
    const statsBox = document.getElementById("statsBox");
    const mapEmptyOverlay = document.getElementById("mapEmptyOverlay");

    // Basis Salzburg/Hangar-7 (Heimatbasis der Flying Bulls) -- Default-
    // Mittelpunkt, solange nichts in der Luft ist.
    const HOME_BASE = { lat: 47.7933, lon: 13.0043 };

    let liveMap = null;
    let liveMapMarkers = null;
    const markerByReg = new Map();
    let latestAircraft = [];
    // Letzter abgeschlossener Flug (Archiv, neueste zuerst) -- wird auf
    // der Karte als Strecke gezeigt, solange niemand live ist (auf
    // Nutzerwunsch, statt nur die leere Heimatbasis-Ansicht zu zeigen).
    let lastFlightForMap = null;

    function initLiveMap() {
      if (liveMap) return;
      if (typeof L === "undefined") return;
      liveMap = L.map("liveMap", { attributionControl: true, zoomControl: true }).setView([HOME_BASE.lat, HOME_BASE.lon], 7);
      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
        maxZoom: 16, attribution: "Tiles &copy; Esri",
      }).addTo(liveMap);
      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
        maxZoom: 16,
      }).addTo(liveMap);
      liveMapMarkers = L.layerGroup().addTo(liveMap);
    }

    function planeDivIcon(rotationDeg) {
      const size = 24;
      const c = size / 2;
      return L.divIcon({
        className: "plane-marker",
        html: `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><g transform="translate(${c} ${c}) rotate(${rotationDeg})"><path d="M0,-9 L6,7 L0,3 L-6,7 Z" fill="#ef4444" stroke="#000000" stroke-width="1"/></g></svg>`,
        iconSize: [size, size], iconAnchor: [c, c],
      });
    }

    function pathToLatLngs(path) {
      return path.map((p) => [p.lat, p.lon]);
    }

    function updateLiveMap(aircraft) {
      initLiveMap();
      if (!liveMap) return;

      const airborne = aircraft.filter((a) => a.airborne && a.lat !== null && a.lat !== undefined && a.lon !== null && a.lon !== undefined);

      liveMapMarkers.clearLayers();
      markerByReg.clear();

      if (airborne.length) {
        mapEmptyOverlay.style.display = "none";

        const bounds = [];
        airborne.forEach((item) => {
          if (Array.isArray(item.path) && item.path.length > 1) {
            L.polyline(pathToLatLngs(item.path), { color: "#ef4444", weight: 2.5, opacity: 0.55 }).addTo(liveMapMarkers);
          }
          const marker = L.marker([item.lat, item.lon], { icon: planeDivIcon(item.track ?? 0) });
          marker.bindTooltip(`${item.type} · ${item.reg}`, { direction: "top", offset: [0, -10] });
          marker.addTo(liveMapMarkers);
          markerByReg.set(item.reg, marker);
          bounds.push([item.lat, item.lon]);
        });

        if (bounds.length === 1) {
          liveMap.setView(bounds[0], 9);
        } else {
          liveMap.fitBounds(bounds, { padding: [30, 30], maxZoom: 9 });
        }
        requestAnimationFrame(() => liveMap.invalidateSize());
        return;
      }

      // Niemand live: auf Nutzerwunsch die Strecke des letzten
      // abgeschlossenen Fluges zeigen (statt nur der leeren
      // Heimatbasis-Ansicht) -- sofern dafür Positions-Daten vorliegen
      // (ältere/importierte Archiv-Einträge ohne "path" haben das nicht).
      const lastPath = lastFlightForMap && Array.isArray(lastFlightForMap.path) ? lastFlightForMap.path : [];
      if (lastPath.length > 1) {
        const latlngs = pathToLatLngs(lastPath);
        L.polyline(latlngs, { color: "#ef4444", weight: 2.5, opacity: 0.75 }).addTo(liveMapMarkers);
        L.circleMarker(latlngs[0], { radius: 5, weight: 2, color: "#ef4444", fillColor: "#ef4444", fillOpacity: 1 })
          .bindTooltip("Start", { direction: "top" }).addTo(liveMapMarkers);
        L.circleMarker(latlngs[latlngs.length - 1], { radius: 5, weight: 2, color: "#a1a1aa", fillColor: "#a1a1aa", fillOpacity: 1 })
          .bindTooltip("Landung", { direction: "top" }).addTo(liveMapMarkers);
        liveMap.fitBounds(latlngs, { padding: [30, 30], maxZoom: 10 });

        mapEmptyOverlay.className = "map-empty-overlay badge";
        mapEmptyOverlay.innerHTML = `Keine live &middot; letzte Strecke: <b>${escapeHtml(lastFlightForMap.type)} ${escapeHtml(lastFlightForMap.reg)}</b>`;
        mapEmptyOverlay.style.display = "block";
      } else {
        liveMap.setView([HOME_BASE.lat, HOME_BASE.lon], 7);
        mapEmptyOverlay.className = "map-empty-overlay full";
        mapEmptyOverlay.textContent = "Aktuell keine Flying Bulls in der Luft.";
        mapEmptyOverlay.style.display = "flex";
      }
      requestAnimationFrame(() => liveMap.invalidateSize());
    }

    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function fmtNum(n) { return new Intl.NumberFormat("de-DE").format(n); }
    function fmtTime(ms) {
      return new Date(ms).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" });
    }
    function fmtRelative(ms) {
      const diffMin = Math.max(0, Math.round((Date.now() - ms) / 60000));
      if (diffMin < 1) return "gerade eben";
      if (diffMin < 60) return `vor ${diffMin} Min`;
      const h = Math.floor(diffMin / 60), m = diffMin % 60;
      return `vor ${h} Std${m ? ` ${m} Min` : ""}`;
    }
    function fmtDuration(startMs, endMs) {
      const diffMin = Math.max(0, Math.round((endMs - startMs) / 60000));
      const h = Math.floor(diffMin / 60), m = diffMin % 60;
      return h > 0 ? `${h} Std ${m} Min` : `${m} Min`;
    }
    function fmtHours(totalMinutes) {
      const h = Math.floor(totalMinutes / 60), m = Math.round(totalMinutes % 60);
      return h > 0 ? `${h} Std ${m} Min` : `${m} Min`;
    }

    function renderStats(stats) {
      if (!stats || !stats.totalFlights) {
        return `<div class="empty small">Noch keine Daten für eine Statistik -- sammelt sich mit jedem abgeschlossenen Flug.</div>`;
      }
      const top = stats.topAircraft[0];
      return `
        <div class="card">
          <div class="stat-row">
            <div class="stat"><div class="stat-label">Flüge gesamt</div><div class="stat-value">${fmtNum(stats.totalFlights)}</div></div>
            <div class="stat"><div class="stat-label">Flugzeit gesamt</div><div class="stat-value compact">${fmtHours(stats.totalFlightMinutes)}</div></div>
            <div class="stat"><div class="stat-label">Distanz gesamt</div><div class="stat-value">${fmtNum(stats.totalDistanceKm)}<span class="stat-unit">km</span></div></div>
          </div>
          <div class="stat-row">
            <div class="stat"><div class="stat-label">Letzte 30 Tage</div><div class="stat-value">${stats.last30Days.flights}<span class="stat-unit">Flüge</span></div></div>
            ${top ? `<div class="stat"><div class="stat-label">Meistgeflogen</div><div class="stat-value compact">${escapeHtml(top.type)}<span class="stat-unit">${escapeHtml(top.reg)}</span></div></div>` : ""}
            ${stats.longestFlight ? `<div class="stat"><div class="stat-label">Längster Flug</div><div class="stat-value compact">${fmtHours(stats.longestFlight.minutes)}</div></div>` : ""}
          </div>
        </div>
      `;
    }

    function renderCard(item) {
      const route = `
        <div class="route">
          <span class="city">${item.origin ? escapeHtml(item.origin) : '<span class="unknown">Unbekannt</span>'}</span>
          <span class="arrow">&rarr;</span>
          <span class="city dest">${item.destination ? escapeHtml(item.destination) : '<span class="unknown">Unbekannt</span>'}</span>
        </div>
      `;

      const stats = item.airborne ? `
        <div class="stat-row">
          ${item.altitudeM !== null && item.altitudeM !== undefined ? `<div class="stat"><div class="stat-label">Höhe</div><div class="stat-value">${fmtNum(item.altitudeM)}<span class="stat-unit">m</span></div></div>` : ""}
          ${item.speedKmh !== null && item.speedKmh !== undefined ? `<div class="stat"><div class="stat-label">Speed</div><div class="stat-value">${item.speedKmh}<span class="stat-unit">km/h</span></div></div>` : ""}
          ${item.track !== null && item.track !== undefined ? `<div class="stat"><div class="stat-label">Kurs</div><div class="stat-value">${item.track}&deg;</div></div>` : ""}
        </div>
      ` : "";

      const meta = item.airborne
        ? `Gestartet ${fmtTime(item.takeoffAt)} (${fmtRelative(item.takeoffAt)}) &middot; zuletzt gesehen ${fmtRelative(item.lastSeenAt)}`
        : `Gestartet ${fmtTime(item.takeoffAt)} &middot; Gelandet ${fmtTime(item.landedAt)} (${fmtRelative(item.landedAt)}) &middot; Flugzeit ${fmtDuration(item.takeoffAt, item.landedAt)}`;

      const photo = item.photoUrl
        ? `<img class="card-photo" src="${escapeHtml(item.photoUrl)}" alt="${escapeHtml(item.type)}" loading="lazy" onerror="this.remove()">`
        : "";

      return `
        <div class="card ${item.airborne ? "is-airborne" : ""}">
          <div class="card-top">
            <div class="card-top-main">
              ${photo}
              <div>
                <div class="card-title">${escapeHtml(item.type)}</div>
                <div class="card-sub">${escapeHtml(item.reg)} &middot; ${escapeHtml(item.callsign)}</div>
              </div>
            </div>
            <span class="pill ${item.airborne ? "is-airborne" : "is-landed"}">${item.airborne ? '<span class="live-dot" style="animation:none;box-shadow:none"></span> In der Luft' : "Gelandet"}</span>
          </div>
          ${route}
          ${stats}
          <div class="meta">${meta}</div>
        </div>
      `;
    }

    function fmtDateLabel(ms) {
      const d = new Date(ms);
      const today = new Date();
      const yesterday = new Date(today);
      yesterday.setDate(today.getDate() - 1);
      const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
      if (sameDay(d, today)) return "Heute";
      if (sameDay(d, yesterday)) return "Gestern";
      return d.toLocaleDateString("de-DE", { day: "2-digit", month: "long", timeZone: "Europe/Berlin" });
    }

    function renderArchiveRows(flights) {
      let html = "";
      let lastLabel = null;
      for (const f of flights) {
        const label = fmtDateLabel(f.takeoffAt);
        if (label !== lastLabel) {
          html += `<div class="archive-date-header">${escapeHtml(label)}</div>`;
          lastLabel = label;
        }
        const route = [f.origin, f.destination].filter(Boolean).join(" → ") || "Route unbekannt";
        const timeRange = f.landedAt ? `${fmtTime(f.takeoffAt)}–${fmtTime(f.landedAt)}` : fmtTime(f.takeoffAt);
        const duration = f.landedAt ? fmtDuration(f.takeoffAt, f.landedAt) : "";
        const photo = f.photoUrl
          ? `<img class="archive-photo" src="${escapeHtml(f.photoUrl)}" alt="${escapeHtml(f.type)}" loading="lazy" onerror="this.remove()">`
          : "";
        html += `
          <div class="archive-row">
            <div class="archive-left">
              ${photo}
              <div class="archive-left-text">
                <div class="archive-type-line">${escapeHtml(f.type)}<span class="reg">${escapeHtml(f.reg)}</span></div>
                <div class="archive-route-line">${escapeHtml(route)}</div>
              </div>
            </div>
            <div class="archive-right">${timeRange}${duration ? `<br>${duration}` : ""}</div>
          </div>
        `;
      }
      return html;
    }

    async function loadArchive() {
      try {
        const res = await fetch(ARCHIVE_URL, { headers: { Accept: "application/json" }, cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const flights = Array.isArray(data.flights) ? data.flights : [];
        archiveList.innerHTML = flights.length
          ? renderArchiveRows(flights)
          : `<div class="empty small">Noch keine abgeschlossenen Flüge im Archiv.</div>`;

        lastFlightForMap = flights.length ? flights[0] : null;
        updateLiveMap(latestAircraft);
      } catch (error) {
        archiveList.innerHTML = `<div class="empty small">Archiv gerade nicht verfügbar.</div>`;
      }
    }

    async function loadStats() {
      try {
        const res = await fetch(STATS_URL, { headers: { Accept: "application/json" }, cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const stats = await res.json();
        statsBox.innerHTML = renderStats(stats);
      } catch (error) {
        statsBox.innerHTML = `<div class="empty small">Statistik gerade nicht verfügbar.</div>`;
      }
    }

    async function load() {
      try {
        const res = await fetch(STATUS_URL, { headers: { Accept: "application/json" }, cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const aircraft = Array.isArray(data.aircraft) ? data.aircraft : [];
        latestAircraft = aircraft;

        aircraft.sort((a, b) => {
          if (a.airborne !== b.airborne) return a.airborne ? -1 : 1;
          const aTime = a.airborne ? a.takeoffAt : (a.landedAt ?? a.takeoffAt);
          const bTime = b.airborne ? b.takeoffAt : (b.landedAt ?? b.takeoffAt);
          return bTime - aTime;
        });

        const anyAirborne = aircraft.some((a) => a.airborne);
        liveDot.classList.toggle("calm", !anyAirborne);
        statusText.textContent = anyAirborne
          ? "Live"
          : `Geprüft ${new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" })}`;

        updateLiveMap(aircraft);

        content.innerHTML = aircraft.length
          ? aircraft.map(renderCard).join("")
          : `<div class="empty">Aktuell kein Flying-Bulls-Flugzeug in der Luft. Du bekommst eine <b>Telegram</b>-Nachricht, sobald eines startet.</div>`;
      } catch (error) {
        content.innerHTML = `<div class="empty">Daten gerade nicht verfügbar.<br>${escapeHtml(error.message)}</div>`;
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", () => { load(); loadArchive(); loadStats(); });
    load();
    loadArchive();
    loadStats();
    setInterval(load, REFRESH_MS);
    setInterval(loadArchive, REFRESH_MS);
    setInterval(loadStats, REFRESH_MS);
  </script>
</body>
</html>
