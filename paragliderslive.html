<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Gleitschirm Live</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ---------------------------------------------------------------
       Design-System wie control.html/iphone.html: klar umrissene
       Panels (dünner Rahmen) statt freier Typografie -- Karte und
       Pilotenliste stecken jeweils in einem eigenen Panel. Inter +
       JetBrains Mono, streng monochrom, invertiert (schwarzer
       Hintergrund). Gleiche Daten/Fetch-Logik wie bisher, nur
       Layout/Optik neu.
    --------------------------------------------------------------- */
    :root { --black:#ffffff; --white:#000000; --line: var(--black); --line-soft: var(--black); }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--white); color:var(--black); }
    body {
      display: grid; place-items: center; font-family: "Inter", Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: none; text-rendering: optimizeSpeed;
    }
    .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }

    .frame { position: relative; width: 800px; height: 480px; overflow: hidden; background: var(--white); border: 1px solid var(--black); }
    .canvas { position: absolute; top: 30px; left: 34px; right: 34px; bottom: 40px; display: flex; flex-direction: column; }

    .masthead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .mast-left { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5; }
    .mast-right { font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.5; }
    .status-line { font-size: 15px; font-weight: 300; margin-top: 6px; margin-bottom: 14px; }

    .col-label { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5; margin-bottom: 8px; }

    .panel { border: 1px solid var(--line); padding: 12px 14px; }

    .split { display: flex; gap: 16px; flex: 1; min-height: 0; }
    .map-col { flex: 1; position: relative; min-width: 0; padding: 4px; }
    #mapSvg { width: 100%; height: 100%; color: var(--black); }
    .list-col { flex: 0 0 220px; display: flex; flex-direction: column; overflow: hidden; }

    .pilot-list { display: flex; flex-direction: column; overflow-y: hidden; }
    .pilot-row { display: flex; align-items: baseline; gap: 10px; padding: 6px 0; }
    .pilot-row + .pilot-row { border-top: 1px dashed var(--line-soft); }
    .pilot-idx { width: 16px; font-size: 10.5px; opacity: 0.4; flex-shrink: 0; }
    .pilot-alt { font-size: 15px; font-weight: 600; flex: 1; }
    .pilot-alt-unit { font-size: 10px; font-weight: 400; opacity: 0.6; }
    .pilot-climb { font-size: 12px; opacity: 0.75; flex-shrink: 0; }

    .empty { display: flex; flex-direction: column; gap: 6px; padding-top: 12px; }
    .empty .headline { font-size: 16px; font-weight: 500; }
    .empty .sub { font-size: 11px; opacity: 0.6; }

    .footer {
      position: absolute; left: 34px; right: 34px; bottom: 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      font-size: 8.5px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1; opacity: 0.45;
    }
  </style>
</head>

<body>
  <main class="frame">
    <div class="canvas">
      <div class="masthead">
        <span class="mast-left mono">R.U.D.I. &middot; Gleitschirm Live</span>
        <span class="mast-right mono" id="mastDate">&ndash;</span>
      </div>
      <p class="status-line mono" id="subtitle">L&auml;dt&hellip;</p>

      <div class="split" id="main">
        <div class="map-col panel"><div class="empty"><div class="headline">L&auml;dt&hellip;</div></div></div>
        <div class="list-col panel"></div>
      </div>
    </div>

    <footer class="footer mono">
      <span>Open Glider Network &middot; 15 km um Grassau</span>
      <span id="updatedAt">Updating</span>
    </footer>
  </main>

  <script>
    "use strict";

    const API = "https://rudi.marvinradar.workers.dev/paragliders";
    const REFRESH_INTERVAL_MS = 5 * 60 * 1000; // Live-Tracking, kürzerer Takt als andere Seiten

    const mainEl = document.getElementById("main");
    const subtitle = document.getElementById("subtitle");
    const updatedAt = document.getElementById("updatedAt");
    const mastDate = document.getElementById("mastDate");

    // SVG-Karte: einfache lokale Projektion (kein echtes Kartenmaterial
    // nötig) -- Breiten-/Längengrad relativ zum Zentrum (Grassau) in
    // Pixel umgerechnet. Auf dieser Reichweite (15km) ist die
    // Verzerrung durch die vereinfachte Projektion vernachlässigbar.
    function project(lat, lon, center, scalePxPerKm) {
      const kmPerDegLat = 111;
      const kmPerDegLon = 111 * Math.cos((center.lat * Math.PI) / 180);
      const dxKm = (lon - center.lon) * kmPerDegLon;
      const dyKm = (lat - center.lat) * kmPerDegLat;
      return { x: dxKm * scalePxPerKm, y: -dyKm * scalePxPerKm };
    }

    function climbArrow(climbRate) {
      if (climbRate == null) return "–";
      if (climbRate >= 1.5) return "↑↑";
      if (climbRate >= 0.3) return "↑";
      if (climbRate <= -1.5) return "↓↓";
      if (climbRate <= -0.3) return "↓";
      return "→";
    }

    async function load() {
      const now = new Date();
      const dayName = now.toLocaleDateString("de-DE", { weekday: "long", timeZone: "Europe/Berlin" }).toUpperCase();
      const fullDate = now.toLocaleDateString("de-DE", { day: "2-digit", month: "long", year: "numeric", timeZone: "Europe/Berlin" });
      mastDate.textContent = `${dayName} · ${fullDate}`;

      try {
        const res = await fetch(API, { headers: { Accept: "application/json" }, cache: "no-store" });
        const data = await res.json();

        if (!res.ok || data.error) {
          renderEmpty(data);
        } else {
          render(data);
        }

        updatedAt.textContent = `Updated ${now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" })}`;
      } catch (error) {
        console.error(error);
        renderEmpty({ reason: "Verbindung fehlgeschlagen" });
        updatedAt.textContent = "Update failed";
      }
    }

    function renderEmpty(data) {
      subtitle.textContent = "Keine Daten";
      mainEl.querySelector(".map-col").innerHTML = `
        <div class="empty">
          <div class="headline">Nicht verf&uuml;gbar</div>
          <div class="sub mono">${data.detail || data.reason || "OGN nicht erreichbar"}</div>
        </div>`;
      mainEl.querySelector(".list-col").innerHTML = "";
    }

    function render(data) {
      const pilots = data.pilots || [];
      subtitle.textContent = pilots.length
        ? `${pilots.length} Gleitschirm${pilots.length === 1 ? "" : "e"} in der Luft`
        : "Gerade niemand in der Luft";

      // --- Karte ---
      const W = 500, H = 320; // ungefähre verfügbare Fläche der linken Spalte
      const scale = (Math.min(W, H) / 2 - 20) / data.radiusKm; // px pro km, mit Rand

      const center = data.center;

      let svg = `<svg id="mapSvg" viewBox="${-W/2} ${-H/2} ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;

      // Entfernungsringe (5/10/15 km)
      [5, 10, 15].forEach((km) => {
        svg += `<circle cx="0" cy="0" r="${km * scale}" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3" opacity="0.35" />`;
        svg += `<text x="4" y="${-km * scale - 3}" font-size="8" font-family="JetBrains Mono, monospace" fill="currentColor" opacity="0.5">${km}km</text>`;
      });

      // Zentrum (Grassau)
      svg += `<circle cx="0" cy="0" r="4" fill="currentColor" />`;
      svg += `<text x="7" y="4" font-size="10" font-weight="700" font-family="Inter, sans-serif" fill="currentColor">${center.label}</text>`;

      // Bekannte Startplätze
      (data.launchSites || []).forEach((site) => {
        const p = project(site.lat, site.lon, center, scale);
        if (Math.abs(p.x) > W / 2 || Math.abs(p.y) > H / 2) return; // außerhalb der Karte
        svg += `<path d="M${p.x} ${p.y - 6} L${p.x + 5} ${p.y + 4} L${p.x - 5} ${p.y + 4} Z" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.8" />`;
        svg += `<text x="${p.x + 8}" y="${p.y + 3}" font-size="8" font-family="JetBrains Mono, monospace" fill="currentColor" opacity="0.7">${site.name}</text>`;
      });

      // Piloten als nummerierte Punkte
      pilots.forEach((pilot, i) => {
        const p = project(pilot.lat, pilot.lon, center, scale);
        const num = i + 1;
        svg += `<circle cx="${p.x}" cy="${p.y}" r="9" fill="var(--white)" stroke="currentColor" stroke-width="1.8" />`;
        svg += `<text x="${p.x}" y="${p.y + 3.5}" font-size="9" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace" fill="currentColor">${num}</text>`;
      });

      svg += `</svg>`;

      mainEl.querySelector(".map-col").innerHTML = svg;

      // --- Liste ---
      if (!pilots.length) {
        mainEl.querySelector(".list-col").innerHTML = `<p class="col-label">Piloten</p><p style="font-size:12px; opacity:0.6;">Keine Gleitschirme im Umkreis erkannt.</p>`;
        return;
      }

      const items = pilots.map((pilot, i) => `
        <div class="pilot-row">
          <span class="pilot-idx mono">${String(i + 1).padStart(2, "0")}</span>
          <span class="pilot-alt">${pilot.altitude != null ? pilot.altitude : "–"}<span class="pilot-alt-unit"> m</span></span>
          <span class="pilot-climb mono">${climbArrow(pilot.climbRate)}${pilot.climbRate != null ? " " + pilot.climbRate.toFixed(1) : ""}</span>
        </div>
      `).join("");

      mainEl.querySelector(".list-col").innerHTML = `<p class="col-label">Piloten (${pilots.length})</p><div class="pilot-list">${items}</div>`;
    }

    load();
    setInterval(load, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
