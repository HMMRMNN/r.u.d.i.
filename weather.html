<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Wetter &amp; Familie</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ---------------------------------------------------------------
       Kompletter Neuentwurf (v2): weg von "Box mit Rahmen um alles" --
       Struktur entsteht durch Typografie-Hierarchie (Größe/Gewicht)
       und Weißraum statt vieler Trennlinien. Nur die äußere Frame-
       Kontur bleibt als einzige durchgezogene Linie. Streng monochrom
       (reines #000/#fff), aktuell invertiert (schwarzer Hintergrund).
       Gleiche Daten/Fetch-Logik wie bisher, nur Layout/Optik neu.
    --------------------------------------------------------------- */
    :root { --black:#ffffff; --white:#000000; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--white); color:var(--black); }
    body {
      display: grid; place-items: center; font-family: "Inter", Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: none; text-rendering: optimizeSpeed;
    }
    .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }

    .frame { position: relative; width: 800px; height: 480px; overflow: hidden; background: var(--white); border: 1px solid var(--black); }
    .canvas { position: absolute; top: 30px; left: 34px; right: 34px; bottom: 40px; display: flex; flex-direction: column; }

    /* ---- Masthead: keine Box, keine Trennlinie -- nur eine leise,
       kleine Zeile, die den früheren Header komplett ersetzt. ---- */
    .masthead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 26px; }
    .mast-left { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5; }
    .mast-right { font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.5; }

    /* ---- Hero: der einzige wirklich große Wert auf der Seite. ---- */
    .hero { display: flex; align-items: flex-end; gap: 16px; }
    .hero-temp { font-size: 152px; font-weight: 200; line-height: 0.82; letter-spacing: -0.04em; }
    .hero-side { padding-bottom: 14px; }
    .hero-cond { font-size: 22px; font-weight: 400; }
    .hero-range { margin-top: 4px; font-size: 12px; opacity: 0.55; }

    .stat-line { margin-top: 16px; font-size: 12px; letter-spacing: 0.02em; opacity: 0.7; }
    .stat-line + .stat-line { margin-top: 6px; opacity: 0.55; }

    /* ---- 5-Tage-Ausblick: reine Typo-Reihe, keine Kästen. ---- */
    .outlook { margin-top: 34px; }
    .outlook-label { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5; margin-bottom: 12px; }
    .outlook-row { display: flex; gap: 28px; }
    .outlook-item { flex: 1; }
    .outlook-day { font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55; }
    .outlook-temp { margin-top: 6px; font-size: 30px; font-weight: 300; letter-spacing: -0.02em; }
    .outlook-cond { margin-top: 4px; font-size: 10px; opacity: 0.6; }

    /* ---- Untere Zone: zwei Spalten, ohne Rahmen, nur durch Abstand
       und die Spaltenlücke getrennt. ---- */
    .lower { margin-top: 34px; flex: 1; min-height: 0; display: flex; gap: 40px; }
    .col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .col-label { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5; margin-bottom: 12px; }

    .activity-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
    .activity-list li { display: flex; gap: 10px; align-items: baseline; font-size: 13px; }
    .activity-list .num { font-size: 9px; opacity: 0.45; width: 14px; flex-shrink: 0; }

    .recipe-list { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: hidden; }
    .recipe-item { min-height: 0; }
    .recipe-title { font-size: 13px; font-weight: 600; }
    .recipe-desc {
      margin-top: 2px; font-size: 10.5px; opacity: 0.6; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .footer {
      position: absolute; left: 34px; right: 34px; bottom: 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      font-size: 8.5px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1; opacity: 0.45;
    }
    .empty { position: absolute; inset: 30px 34px 40px; display: grid; place-items: center; font-size: 13px; text-align: center; }
  </style>
</head>

<body>
  <main class="frame">
    <div class="canvas" id="canvas">
      <div class="empty mono">Loading&hellip;</div>
    </div>
    <footer class="footer mono">
      <span>Grassau, Germany</span>
      <span id="updatedAt">Updating</span>
    </footer>
  </main>

  <script>
    "use strict";

    const LOCATION = { lat: 47.7756, lon: 12.4550 };
    const WEATHER_API = "https://api.open-meteo.com/v1/forecast";
    const REFRESH_INTERVAL_MS = 30 * 60 * 1000;

    const WEATHER_LABELS = {
      0: "Klar", 1: "Überw. klar", 2: "Teilw. bewölkt", 3: "Bedeckt",
      45: "Nebel", 48: "Reifnebel",
      51: "Nieselregen", 53: "Nieselregen", 55: "Nieselregen",
      61: "Regen", 63: "Regen", 65: "Regen",
      71: "Schnee", 73: "Schnee", 75: "Schnee",
      80: "Schauer", 81: "Schauer", 82: "Schauer",
      95: "Gewitter", 96: "Gewitter", 99: "Gewitter",
    };

    function weatherLabel(code) { return WEATHER_LABELS[Number(code)] || "Unbekannt"; }

    // Inspirationsliste kindgerechter Gerichte fürs Kleinkind – überwiegend,
    // aber nicht ausschließlich für den Thermomix geeignet. Bewusst kurz
    // und ohne vollständiges Rezept gehalten: soll nur Ideen liefern, keine
    // exakten Mengen/Stufen/Zeiten vorgeben (siehe frühere Überlegung:
    // keine ungeeigneten/scharfen Vorschläge riskieren, keine erfundenen
    // TM-Einstellungen als vermeintlich verifizierte Fakten ausgeben).
    // Keine Aufteilung nach Mahlzeit (Frühstück/Mittag/Abend) – flache Liste.
    const RECIPE_IDEAS = [
      { name: "Tomatensuppe", desc: "Tomaten, Zwiebel, etwas Sahne, fein p&uuml;riert" },
      { name: "Bolognese", desc: "Faschiertes, Tomaten, Gem&uuml;se fein gehackt, mit Nudeln" },
      { name: "K&uuml;rbissuppe", desc: "K&uuml;rbis, Kartoffel, etwas Kokosmilch, cremig p&uuml;riert" },
      { name: "Brokkoli-K&auml;se-Suppe", desc: "Brokkoli, Kartoffel, milder K&auml;se, s&auml;mig" },
      { name: "K&auml;se-Sp&auml;tzle", desc: "Sp&auml;tzleteig, mit K&auml;se untergehoben" },
      { name: "Milchreis", desc: "Rundkornreis, Milch, leicht ges&uuml;&szlig;t, mit Zimt" },
      { name: "Gem&uuml;se-Risotto", desc: "Reis, buntes Gem&uuml;se fein gew&uuml;rfelt, cremig gegart" },
      { name: "Linsen-Curry (mild)", desc: "Rote Linsen, Kokosmilch, ohne Sch&auml;rfe" },
      { name: "Hackb&auml;llchen in Tomatensauce", desc: "Kleine B&auml;llchen, milde Sauce, dazu Kartoffelp&uuml;ree" },
      { name: "Ofengem&uuml;se-Sticks", desc: "Karotte, Zucchini, S&uuml;&szlig;kartoffel, weich im Ofen gegart" },
      { name: "Gem&uuml;se-Frikadellen", desc: "Karotte, Zucchini, Haferflocken, in der Pfanne gebraten" },
      { name: "Apfelmus", desc: "&Auml;pfel weich gegart, fein p&uuml;riert, ohne Zuckerzusatz" },
      { name: "Grie&szlig;brei", desc: "Milch, Grie&szlig;, mild ges&uuml;&szlig;t, mit Fruchtmus" },
      { name: "Blumenkohl-K&auml;se-Auflauf", desc: "Blumenkohl gegart, milde K&auml;sesauce, &uuml;berbacken" },
      { name: "Gem&uuml;se-Couscous", desc: "Couscous, fein gew&uuml;rfeltes Gem&uuml;se, mild gew&uuml;rzt" },
      { name: "Pfannkuchen", desc: "D&uuml;nner Teig, in der Pfanne gebacken, mit Apfelmus" },
      { name: "Vollkorn-Pizza mit Gem&uuml;se", desc: "Teig, mildem Belag, im Ofen &uuml;berbacken" },
      { name: "S&uuml;&szlig;kartoffel-P&uuml;ree", desc: "S&uuml;&szlig;kartoffel, etwas Butter, cremig gest&auml;mpft" },
      { name: "Zucchini-Puffer", desc: "Zucchini fein geraspelt, in der Pfanne goldbraun gebraten" },
      { name: "Kartoffel-M&ouml;hren-Eintopf", desc: "Kartoffel, Karotte, mild gew&uuml;rzt, st&uuml;ckig oder p&uuml;riert" },
      { name: "H&auml;hnchen-Gem&uuml;se-Auflauf", desc: "Zartes H&auml;hnchen, Brokkoli, wenig K&auml;se &uuml;berbacken" },
      { name: "Blumenkohlsuppe", desc: "Blumenkohl, Kartoffel, etwas Muskat, fein p&uuml;riert" },
      { name: "S&uuml;&szlig;kartoffelsuppe", desc: "S&uuml;&szlig;kartoffel, Karotte, mild gew&uuml;rzt" },
      { name: "Spinat-Kartoffel-Suppe", desc: "Blattspinat, Kartoffel, etwas Sahne, fein p&uuml;riert" },
      { name: "Maissuppe", desc: "Mais, Kartoffel, etwas Sahne, leicht s&uuml;&szlig;lich" },
      { name: "Tomaten-K&auml;se-Nudeln", desc: "Nudeln, milde Tomatensauce, geriebener K&auml;se" },
      { name: "Fr&uuml;hst&uuml;cksmuffins herzhaft", desc: "Ei, Gem&uuml;se, wenig K&auml;se, im Muffinblech gebacken" },
      { name: "Hirsebrei", desc: "Hirse, Milch, mild ges&uuml;&szlig;t, mit Obst" },
      { name: "Polenta mit Gem&uuml;se", desc: "Maisgrie&szlig; cremig gekocht, mit weichem Gem&uuml;se" },
      { name: "Fischst&auml;bchen selbstgemacht", desc: "Fisch, milde Panade, im Ofen statt frittiert" },
      { name: "Kichererbsenbratlinge", desc: "Kichererbsen, Karotte, mild gew&uuml;rzt, gebraten" },
      { name: "Kartoffelpuffer", desc: "Kartoffel fein geraspelt, in der Pfanne goldbraun" },
      { name: "Ofen-Gem&uuml;sepuffer", desc: "Buntes Gem&uuml;se, Haferflocken, im Ofen statt in Fett gebacken" },
      { name: "Bananen-Hafer-Pfannkuchen", desc: "Nur Banane, Ei, Haferflocken, ohne Zuckerzusatz" },
      { name: "Vollkorn-Br&ouml;tchen", desc: "Einfacher Teig, als kleine Portionen gebacken" },
      { name: "Birnen-Kompott", desc: "Birnen weich gegart, leicht ges&uuml;&szlig;t, mit Zimt" },
      { name: "Vanillepudding", desc: "Milch, Vanille, hausgemacht statt Fertigpulver" },
      { name: "Hausgemachte Tomatensauce", desc: "Tomaten, Zwiebel, Karotte, fein p&uuml;riert, als Basis" },
      { name: "Gem&uuml;se-Muffins s&uuml;&szlig;", desc: "Karotte oder Zucchini im Teig versteckt, mild ges&uuml;&szlig;t" },
      { name: "Mini-Gem&uuml;se-Quiche", desc: "M&uuml;rbteig, mit mildem Gem&uuml;se-Belag, im Ofen gebacken" },
    ];

    const canvas = document.getElementById("canvas");
    const updatedAt = document.getElementById("updatedAt");

    function dayOfYear(date) {
      const start = new Date(date.getFullYear(), 0, 0);
      return Math.floor((date - start) / 86400000);
    }

    function deriveActivities(tempMax, precipSum, weathercode) {
      const isRainy = precipSum > 1 || [51,53,55,61,63,65,80,81,82,95,96,99].includes(weathercode);
      const isSnowy = [71,73,75].includes(weathercode) || tempMax < 1;
      const isHot = tempMax >= 24;
      const isNice = !isRainy && tempMax >= 12;

      if (isSnowy) return { activities: ["Schlitten fahren", "Schneemann bauen", "Kakao-Pause danach"] };
      if (isRainy) return { activities: ["Indoor-Spielplatz", "Backen zusammen", "Bastelnachmittag"] };
      if (isHot) return { activities: ["Freibad / Planschbecken", "Wasserspiele im Garten", "Schatten-Spielplatz vormittags"] };
      if (isNice) return { activities: ["Spielplatz-Besuch", "Spaziergang / kleine Wanderung", "Fahrrad/Laufrad üben"] };
      return { activities: ["Kurzer Spaziergang zwischendurch", "Spielplatz, wenn's trocken bleibt", "Bastel-/Spielenachmittag"] };
    }

    async function loadWeather() {
      try {
        const params = new URLSearchParams({
          latitude: String(LOCATION.lat),
          longitude: String(LOCATION.lon),
          hourly: ["temperature_2m"].join(","),
          daily: [
            "temperature_2m_max", "temperature_2m_min", "uv_index_max",
            "sunrise", "sunset", "precipitation_sum", "windspeed_10m_max", "weathercode",
          ].join(","),
          timezone: "Europe/Berlin",
          forecast_days: "6",
        });

        const response = await fetch(`${WEATHER_API}?${params.toString()}`, {
          headers: { Accept: "application/json" }, cache: "no-store",
        });
        if (!response.ok) throw new Error(`Weather HTTP ${response.status}`);

        const data = await response.json();
        render(data);

        updatedAt.textContent = `Updated ${new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" })}`;
      } catch (error) {
        console.error(error);
        canvas.innerHTML = '<div class="empty mono">Wetterdaten nicht verf&uuml;gbar.</div>';
        updatedAt.textContent = "Update failed";
      }
    }

    function render(data) {
      const now = new Date();
      const dayName = now.toLocaleDateString("de-DE", { weekday: "long", timeZone: "Europe/Berlin" }).toUpperCase();
      const fullDate = now.toLocaleDateString("de-DE", { day: "2-digit", month: "long", year: "numeric", timeZone: "Europe/Berlin" });

      const daily = data.daily;
      const hourly = data.hourly;

      const tMax = Math.round(daily.temperature_2m_max[0]);
      const tMin = Math.round(daily.temperature_2m_min[0]);
      const uvMax = daily.uv_index_max[0];
      const precipSum = daily.precipitation_sum[0];
      const windMax = Math.round(daily.windspeed_10m_max[0]);
      const sunrise = new Date(daily.sunrise[0]).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" });
      const sunset = new Date(daily.sunset[0]).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" });
      const weathercode = daily.weathercode[0];
      const condition = weatherLabel(weathercode);

      const nowIsoHour = now.toISOString().slice(0, 13);
      let liveIdx = hourly.time.findIndex((t) => t.startsWith(nowIsoHour));
      if (liveIdx < 0) liveIdx = 12;
      const tLive = Math.round(hourly.temperature_2m[liveIdx]);

      // 5-Tage-Ausblick: Index 1-5 (heute = 0)
      const outlookDays = [1, 2, 3, 4, 5].map((i) => {
        const d = new Date(daily.time[i] + "T12:00:00");
        return {
          name: d.toLocaleDateString("de-DE", { weekday: "short", timeZone: "Europe/Berlin" }).toUpperCase(),
          cond: weatherLabel(daily.weathercode[i]),
          tMax: Math.round(daily.temperature_2m_max[i]),
        };
      });

      const plan = deriveActivities(tMax, precipSum, weathercode);
      const doy = dayOfYear(now);
      const n = RECIPE_IDEAS.length;
      const recipe1 = RECIPE_IDEAS[doy % n];
      const recipe2 = RECIPE_IDEAS[(doy + Math.floor(n / 3)) % n];
      const recipe3 = RECIPE_IDEAS[(doy + Math.floor((2 * n) / 3)) % n];
      const needsJacket = tMax < 15 || precipSum > 0.5;
      const needsSunscreen = uvMax >= 4;

      canvas.innerHTML = `
        <div class="masthead">
          <span class="mast-left mono">R.U.D.I. &middot; Wetter &amp; Familie</span>
          <span class="mast-right mono">${dayName} &middot; ${fullDate}</span>
        </div>

        <div class="hero">
          <div class="hero-temp">${tLive}&deg;</div>
          <div class="hero-side">
            <div class="hero-cond">${condition}</div>
            <div class="hero-range mono">Heute ${tMin}&deg;&ndash;${tMax}&deg;C</div>
          </div>
        </div>
        <div class="stat-line mono">UV ${uvMax.toFixed(1)} &middot; Regen ${precipSum.toFixed(1)}mm &middot; Wind ${windMax}km/h &middot; Sonne ${sunrise}&ndash;${sunset}</div>
        <div class="stat-line mono">${needsJacket ? "Jacke nötig" : "Leicht reicht"} &middot; ${needsSunscreen ? "Sonnencreme nötig" : "Kein starker Sonnenschutz nötig"}</div>

        <div class="outlook">
          <div class="outlook-label">5-Tage-Ausblick</div>
          <div class="outlook-row">
            ${outlookDays.map((d) => `
              <div class="outlook-item">
                <div class="outlook-day">${d.name}</div>
                <div class="outlook-temp">${d.tMax}&deg;</div>
                <div class="outlook-cond">${d.cond}</div>
              </div>
            `).join("")}
          </div>
        </div>

        <div class="lower">
          <div class="col">
            <div class="col-label">Aktivit&auml;ten heute</div>
            <ul class="activity-list">
              ${plan.activities.map((a, i) => `<li><span class="num mono">${String(i + 1).padStart(2, "0")}</span><span>${a}</span></li>`).join("")}
            </ul>
          </div>
          <div class="col">
            <div class="col-label">Rezeptideen</div>
            <div class="recipe-list">
              <div class="recipe-item"><div class="recipe-title">${recipe1.name}</div><div class="recipe-desc">${recipe1.desc}</div></div>
              <div class="recipe-item"><div class="recipe-title">${recipe2.name}</div><div class="recipe-desc">${recipe2.desc}</div></div>
              <div class="recipe-item"><div class="recipe-title">${recipe3.name}</div><div class="recipe-desc">${recipe3.desc}</div></div>
            </div>
          </div>
        </div>
      `;
    }

    loadWeather();
    setInterval(loadWeather, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
